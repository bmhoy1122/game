<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2e1430">
<title>커플 빙고</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    color:#4a2b3f;background:#3a1b3c}
  body{background:radial-gradient(130% 80% at 50% 0%,#ffd9c0 0%,#ff9fb0 38%,#b3688f 72%,#53284f 100%);
    background-attachment:fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    display:flex;justify-content:center}
  #app{width:100%;max-width:440px;padding:18px 16px 28px;display:flex;flex-direction:column;gap:14px}

  h1{margin:4px 0 0;font-size:27px;letter-spacing:-.5px;color:#fff;text-align:center;
    text-shadow:0 2px 10px rgba(80,30,60,.35)}
  .sub{margin:0;text-align:center;color:#ffffffcc;font-size:13px;font-weight:600}

  .card{background:rgba(255,255,255,.93);border-radius:20px;padding:18px 16px;
    box-shadow:0 10px 30px rgba(70,25,55,.22)}
  .card h2{margin:0 0 12px;font-size:16px;color:#8a3f63}

  button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:14px 16px;cursor:pointer;
    touch-action:manipulation;transition:transform .06s,filter .15s}
  button:active:not(:disabled){transform:scale(.97)}
  button:disabled{opacity:.45;cursor:default}
  .primary{background:linear-gradient(135deg,#ff7a9c,#e8577e);color:#fff;width:100%;font-size:17px;
    box-shadow:0 6px 16px rgba(232,87,126,.35)}
  .ghost{background:#f6e6ee;color:#8a3f63;width:100%}
  .row{display:flex;gap:10px}
  .row>*{flex:1}

  input{font:inherit;width:100%;padding:14px;border-radius:14px;border:2px solid #f0d8e4;
    background:#fff;color:#4a2b3f;font-weight:700;text-align:center}
  input:focus{outline:0;border-color:#e8577e}
  #code{letter-spacing:10px;font-size:26px;font-weight:900;padding-left:10px}

  .codebox{text-align:center;background:linear-gradient(135deg,#fff0f5,#ffe3ec);border-radius:16px;padding:14px}
  .codebox .n{font-size:40px;font-weight:900;letter-spacing:8px;color:#d4446e;padding-left:8px}
  .codebox .t{font-size:12px;font-weight:700;color:#a36084}

  .who{display:flex;gap:8px}
  .who>div{flex:1;text-align:center;background:#f8edf3;border-radius:14px;padding:10px 6px}
  .who .nm{font-size:12px;font-weight:700;color:#a36084;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .v{font-size:22px;font-weight:900;color:#d4446e;line-height:1.2}
  .who .v small{font-size:12px;color:#b98aa4}
  .who.turn0>div:nth-child(1),.who.turn1>div:nth-child(2){background:#ffe0ea;box-shadow:inset 0 0 0 2px #ff9fb8}

  .board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .cell{aspect-ratio:1;border-radius:13px;background:#fdf3f7;color:#9b5a7c;
    font-size:clamp(15px,5.2vw,22px);font-weight:800;display:flex;align-items:center;justify-content:center;
    border:2px solid #f3e0ea;transition:background .18s,color .18s,transform .12s}
  .cell.hit{background:linear-gradient(140deg,#ff8fae,#e8577e);color:#fff;border-color:#e8577e;transform:scale(.96)}
  .cell.line{background:linear-gradient(140deg,#ffd27a,#f6a93b);border-color:#f0a033;color:#5e3a12}
  .cell.last{box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 0 7px #d4446e}
  .cell.pick{cursor:pointer}
  .cell.pick:active{transform:scale(.9)}

  .banner{text-align:center;border-radius:16px;padding:12px;font-weight:800;font-size:15px}
  .banner.me{background:linear-gradient(135deg,#fff3c4,#ffd98a);color:#7a5320}
  .banner.you{background:#efe3ea;color:#8a6a7c}
  .last{text-align:center}
  .last .n{font-size:46px;font-weight:900;color:#d4446e;line-height:1.05}
  .last .n.none{font-size:22px;color:#d9bccb}
  .last .t{font-size:12px;font-weight:700;color:#a36084}

  .result{text-align:center}
  .result .big{font-size:30px;font-weight:900;margin:6px 0}
  .win .big{color:#d4446e} .lose .big{color:#7b6a86} .draw .big{color:#b07a2a}

  #err{background:#5b2340;color:#ffd9e4;border-radius:14px;padding:11px 14px;font-size:13px;
    font-weight:700;text-align:center}
  .hide{display:none!important}
  .muted{color:#a36084;font-size:12.5px;font-weight:700;text-align:center;margin:0}
  .dots::after{content:'';animation:d 1.2s steps(4,end) infinite}
  @keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  a.back{display:block;text-align:center;color:#ffffffc0;font-size:12px;font-weight:700;text-decoration:none;padding:4px}
</style>
</head>
<body>
<div id="app">
  <h1>커플 빙고</h1>
  <p class="sub" id="sub">각자 폰에서 방 코드로 만나요</p>
  <div id="err" class="hide"></div>

  <!-- 1. 시작 -->
  <section id="s-home" class="card hide">
    <h2>방 만들기</h2>
    <input id="name" maxlength="8" placeholder="내 이름 (선택)" autocomplete="off">
    <div style="height:10px"></div>
    <button class="primary" id="b-create">새 방 만들기</button>
    <h2 style="margin-top:22px">코드로 들어가기</h2>
    <input id="code" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
    <div style="height:10px"></div>
    <button class="ghost" id="b-join">들어가기</button>
  </section>

  <!-- 2. 대기 + 판 짜기 -->
  <section id="s-wait" class="card hide">
    <div class="codebox">
      <div class="t">방 코드</div>
      <div class="n" id="w-code">----</div>
    </div>
    <div style="height:10px"></div>
    <button class="ghost" id="b-share">초대 링크 복사</button>
    <p class="muted" id="w-opp" style="margin-top:12px"></p>
    <h2 style="margin-top:14px">내 판</h2>
    <div id="board-wait" class="board"></div>
    <div style="height:12px"></div>
    <div class="row">
      <button class="ghost" id="b-shuffle">다시 섞기</button>
      <button class="primary" id="b-ready">준비 완료</button>
    </div>
    <p class="muted" style="margin-top:10px">숫자 1~25를 아무렇게나 깔아요. <b id="w-goal">3</b>줄 먼저 만들면 이겨요.</p>
  </section>

  <!-- 3. 플레이 -->
  <section id="s-play" class="hide" style="display:flex;flex-direction:column;gap:12px">
    <div class="card" style="padding:14px">
      <div class="who" id="p-who">
        <div><div class="nm" id="p-me-n">나</div><div class="v" id="p-me-v">0<small>줄</small></div></div>
        <div><div class="nm" id="p-you-n">상대</div><div class="v" id="p-you-v">0<small>줄</small></div></div>
      </div>
      <div style="height:12px"></div>
      <div class="banner" id="p-banner">—</div>
      <div style="height:12px"></div>
      <div class="last" id="p-last"><div class="n none" id="p-last-n">아직 없어요</div><div class="t">마지막으로 나온 숫자</div></div>
    </div>
    <div class="card"><div id="board-play" class="board"></div></div>
  </section>

  <!-- 4. 결과 -->
  <section id="s-done" class="card hide">
    <div class="result" id="d-box">
      <div class="big" id="d-big">—</div>
      <p class="muted" id="d-sub"></p>
    </div>
    <div style="height:14px"></div>
    <button class="primary" id="b-again">다시 하기</button>
    <p class="muted" id="d-wait" style="margin-top:10px"></p>
  </section>

  <a class="back" href="../">← 다른 게임</a>
</div>
<script>
/* =========================================================================
   커플 빙고 — 각자 폰에서 방 코드로 만나 번갈아 숫자를 부른다.
   화면 상태는 서버(POST /api/bingo)가 들고 있고, 여기는 그리기만 한다.
   규칙은 netlify/lib/bingo-core.mjs 가 정답이다.
   ========================================================================= */
const SIZE = 5, CELLS = 25, POLL_MS = 1400, POLL_SLOW_MS = 3200;
const $ = (id) => document.getElementById(id);
const SAVE = 'couple-bingo';

let S = { code: null, token: null, you: null, name: '' };
let st = null;                 // 서버가 준 마지막 상태
let localBoard = null;         // 준비 누르기 전의 내 판
let timer = null, busy = false, lastSeenCall = null;

/* ------------------------------------------------------------------ 통신 */
async function api(action, extra) {
  const body = { action, code: S.code, token: S.token, ...(extra || {}) };
  let res;
  try {
    res = await fetch('/api/bingo', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
  } catch (e) {
    throw new Error('인터넷이 끊긴 것 같아요');
  }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    if (res.status === 404 && !data.error) throw new Error('서버를 찾지 못했어요. 넷리파이에 올린 주소로 열어주세요');
    throw new Error(data.error || '요청이 실패했어요 (' + res.status + ')');
  }
  return data;
}
function adopt(data) {
  if (data.token) S.token = data.token;
  if (data.code) S.code = data.code;
  if (typeof data.you === 'number') S.you = data.you;
  st = data;
  save();
  render();
}
function save() {
  try { localStorage.setItem(SAVE, JSON.stringify({ code: S.code, token: S.token, name: S.name })); } catch (e) {}
}
function forget() {
  try { localStorage.removeItem(SAVE); } catch (e) {}
  S = { code: null, token: null, you: null, name: S.name };
  st = null;
}
function err(msg) {
  const e = $('err');
  if (!msg) { e.classList.add('hide'); return; }
  e.textContent = msg; e.classList.remove('hide');
  clearTimeout(err.t); err.t = setTimeout(() => e.classList.add('hide'), 4200);
}
async function act(fn) {              // 버튼 중복 탭 방지 + 에러 표시
  if (busy) return;
  busy = true;
  try { await fn(); err(null); } catch (e) { err(e.message); } finally { busy = false; }
}

/* ------------------------------------------------------------------ 폴링 */
function poll() {
  clearTimeout(timer);
  const gap = (st && st.phase === 'done') ? POLL_SLOW_MS : POLL_MS;
  timer = setTimeout(async () => {
    if (S.code && S.token && document.visibilityState === 'visible' && !busy) {
      try { adopt(await api('state')); } catch (e) { /* 다음 번에 다시 */ }
    }
    poll();
  }, gap);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.code) act(async () => adopt(await api('state')));
});

/* -------------------------------------------------------------- 판 만들기 */
function shuffled() {
  const a = [...Array(CELLS)].map((_, i) => i + 1);
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const LINES = (() => {
  const out = [];
  for (let r = 0; r < SIZE; r++) out.push([...Array(SIZE)].map((_, c) => r * SIZE + c));
  for (let c = 0; c < SIZE; c++) out.push([...Array(SIZE)].map((_, r) => r * SIZE + c));
  out.push([...Array(SIZE)].map((_, i) => i * SIZE + i));
  out.push([...Array(SIZE)].map((_, i) => i * SIZE + (SIZE - 1 - i)));
  return out;
})();
function lineCells(board, called) {
  const hit = new Set(called), on = new Set();
  for (const ln of LINES) if (ln.every((i) => hit.has(board[i]))) ln.forEach((i) => on.add(i));
  return on;
}
function drawBoard(el, board, called, opts) {
  opts = opts || {};
  el.innerHTML = '';
  if (!board) return;
  const hit = new Set(called || []);
  const on = lineCells(board, called || []);
  board.forEach((n, i) => {
    const d = document.createElement('div');
    d.className = 'cell' + (hit.has(n) ? ' hit' : '') + (on.has(i) ? ' line' : '')
      + (opts.last === n ? ' last' : '') + (opts.pick && !hit.has(n) ? ' pick' : '');
    d.textContent = n;
    if (opts.pick && !hit.has(n)) d.onclick = () => opts.pick(n);
    el.appendChild(d);
  });
}

/* -------------------------------------------------------------- 소리 한 톨 */
let AC = null;
function beep(hi) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = 'sine';
    o.frequency.setValueAtTime(hi ? 880 : 520, t);
    o.frequency.exponentialRampToValueAtTime(hi ? 1320 : 680, t + 0.12);
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.18);
  } catch (e) {}
}

/* ------------------------------------------------------------------ 그리기 */
function show(id) {
  ['s-home', 's-wait', 's-play', 's-done'].forEach((s) => $(s).classList.toggle('hide', s !== id));
}
function render() {
  if (!st) { show('s-home'); $('sub').textContent = '각자 폰에서 방 코드로 만나요'; return; }
  const meName = S.name || '나';
  const youName = st.opponent.name || '상대';

  if (st.phase === 'wait') {
    show('s-wait');
    $('sub').textContent = '방 코드를 알려주고 같이 들어와요';
    $('w-code').textContent = st.code;
    $('w-goal').textContent = st.winLines;
    const o = st.opponent;
    $('w-opp').innerHTML = !o.joined
      ? '<span class="dots">상대를 기다리는 중</span>'
      : (o.ready ? '✓ <b>' + youName + '</b> 준비 완료' : youName + ' 들어왔어요. 아직 준비 전');
    if (!localBoard) localBoard = shuffled();
    const mine = st.board || localBoard;
    drawBoard($('board-wait'), mine, []);
    $('b-ready').disabled = !!st.ready;
    $('b-shuffle').disabled = !!st.ready;
    $('b-ready').textContent = st.ready ? '준비 완료 ✓' : '준비 완료';
    return;
  }

  if (st.phase === 'play') {
    show('s-play');
    $('sub').textContent = '방 ' + st.code + ' · ' + st.winLines + '줄 먼저';
    $('p-me-n').textContent = meName;
    $('p-you-n').textContent = youName;
    $('p-me-v').innerHTML = st.lines[S.you] + '<small>줄</small>';
    $('p-you-v').innerHTML = st.lines[1 - S.you] + '<small>줄</small>';
    $('p-who').className = 'who turn' + (st.turn === S.you ? 0 : 1);
    const b = $('p-banner');
    b.className = 'banner ' + (st.yourTurn ? 'me' : 'you');
    b.textContent = st.yourTurn ? '내 차례 — 숫자를 골라요' : youName + ' 차례를 기다려요';
    $('p-last-n').textContent = st.last == null ? '아직 없어요' : st.last;
    $('p-last-n').className = 'n' + (st.last == null ? ' none' : '');
    drawBoard($('board-play'), st.board, st.called, {
      last: st.last,
      pick: st.yourTurn ? (n) => act(async () => { beep(true); adopt(await api('call', { n })); }) : null,
    });
    if (st.last != null && st.last !== lastSeenCall) {
      if (lastSeenCall !== null && !st.yourTurn) beep(false);
      lastSeenCall = st.last;
    }
    return;
  }

  if (st.phase === 'done') {
    show('s-done');
    $('sub').textContent = '방 ' + st.code;
    const mine = st.lines[S.you], theirs = st.lines[1 - S.you];
    const kind = st.winner === 'draw' ? 'draw' : (st.winner === S.you ? 'win' : 'lose');
    $('d-box').className = 'result ' + kind;
    $('d-big').textContent = kind === 'win' ? '🎉 이겼어요!' : kind === 'lose' ? '졌어요…' : '무승부!';
    $('d-sub').textContent = meName + ' ' + mine + '줄 · ' + youName + ' ' + theirs + '줄';
    $('d-wait').textContent = '';
    lastSeenCall = null;
    return;
  }
}

/* ------------------------------------------------------------------ 버튼 */
$('b-create').onclick = () => act(async () => {
  S.name = $('name').value.trim();
  localBoard = shuffled();
  adopt(await api('create', { name: S.name }));
  poll();
});
$('b-join').onclick = () => act(async () => {
  const c = $('code').value.trim();
  if (!/^\d{4}$/.test(c)) throw new Error('네 자리 숫자를 넣어주세요');
  S.name = $('name').value.trim();
  S.code = c;
  localBoard = shuffled();
  adopt(await api('join', { code: c, name: S.name }));
  poll();
});
$('b-shuffle').onclick = () => { localBoard = shuffled(); render(); };
$('b-ready').onclick = () => act(async () => {
  adopt(await api('ready', { board: st.board || localBoard }));
});
$('b-again').onclick = () => act(async () => {
  localBoard = shuffled();
  adopt(await api('restart'));
});
$('b-share').onclick = async () => {
  const url = location.origin + location.pathname + '?code=' + st.code;
  const text = '커플 빙고 하자! 방 코드 ' + st.code + '\n' + url;
  try {
    if (navigator.share) { await navigator.share({ title: '커플 빙고', text: '방 코드 ' + st.code, url }); return; }
    await navigator.clipboard.writeText(text);
    $('b-share').textContent = '복사했어요 ✓';
    setTimeout(() => ($('b-share').textContent = '초대 링크 복사'), 1800);
  } catch (e) { err('복사가 안 돼요. 방 코드 ' + st.code + ' 를 알려주세요'); }
};
['name', 'code'].forEach((id) => $(id).addEventListener('keydown', (e) => {
  if (e.key === 'Enter') $(id === 'code' ? 'b-join' : 'b-create').click();
}));
document.addEventListener('pointerdown', () => beep.unlock || (beep.unlock = 1, beep(false)), { once: true });

/* ------------------------------------------------------------------ 시작 */
(async function boot() {
  show('s-home');
  const urlCode = new URLSearchParams(location.search).get('code');
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(SAVE) || 'null'); } catch (e) {}
  if (saved && saved.name) { S.name = saved.name; $('name').value = saved.name; }

  // 새로고침했으면 있던 방으로 돌아간다
  if (saved && saved.code && saved.token && (!urlCode || urlCode === saved.code)) {
    S.code = saved.code; S.token = saved.token;
    try { adopt(await api('state')); poll(); return; } catch (e) { forget(); }
  }
  if (urlCode && /^\d{4}$/.test(urlCode)) {
    $('code').value = urlCode;
    $('sub').textContent = '초대받은 방 ' + urlCode + ' · 이름을 넣고 들어가요';
  }
  render();
})();
</script>
</body>
</html>
