# 정적 파일은 그대로 올린다. 저장소 루트가 곧 사이트 루트.
# 빌드 명령은 여전히 없고, 넷리파이가 package.json 을 보고 함수 의존성만 설치한다.
[build]
  publish = "."
  command = ""

# 커플 게임들의 방 상태를 들고 있는 함수들 (POST /api/bingo · balance · baseball · gomoku · spice · tiles · expedition · backgammon)
# 규칙 파일은 netlify/lib/ 에 있다. functions 폴더 안의 파일은 하나하나 함수로 배포되기 때문.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 함수가 config.path 로 /api/<게임> 을 잡지만, 구버전 대비로 경로도 열어둔다.
[[redirects]]
  from = "/api/bingo"
  to = "/.netlify/functions/bingo"
  status = 200

[[redirects]]
  from = "/api/balance"
  to = "/.netlify/functions/balance"
  status = 200

[[redirects]]
  from = "/api/baseball"
  to = "/.netlify/functions/baseball"
  status = 200

[[redirects]]
  from = "/api/gomoku"
  to = "/.netlify/functions/gomoku"
  status = 200

[[redirects]]
  from = "/api/spice"
  to = "/.netlify/functions/spice"
  status = 200

[[redirects]]
  from = "/api/tiles"
  to = "/.netlify/functions/tiles"
  status = 200

[[redirects]]
  from = "/api/expedition"
  to = "/.netlify/functions/expedition"
  status = 200

[[redirects]]
  from = "/api/backgammon"
  to = "/.netlify/functions/backgammon"
  status = 200

# 캐시: HTML 은 항상 새로 받고, 그림은 오래 캐시한다.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*/art/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
