<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d3f38">
<title>탐험대</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    color:#22423a;background:#1d3f38}
  body{background:radial-gradient(130% 80% at 50% 0%,#fbefd0 0%,#e3c98f 30%,#5e9a82 66%,#1d3f38 100%);
    background-attachment:fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    display:flex;justify-content:center;
    --pk-accent:#1f7a6a;--pk-soft:#eef6f2;--pk-ink:#1f4a40;--pk-mute:#5f8a7e;--pk-line:#cfe3da}
  #app{width:100%;max-width:440px;padding:14px 12px 24px;display:flex;flex-direction:column;gap:10px}

  h1{margin:2px 0 0;font-size:26px;letter-spacing:-.5px;color:#3b2a10;text-align:center;text-shadow:0 1px 0 #fff8}
  .sub{margin:0;text-align:center;color:#5a4420;font-size:12.5px;font-weight:700}
  .topbar{display:flex;justify-content:center;gap:8px}
  .leave{width:auto;background:none;color:#3b2a10;opacity:.85;font-size:13px;font-weight:800;padding:4px 10px;text-decoration:underline}

  .card{background:rgba(255,255,255,.94);border-radius:18px;padding:14px;box-shadow:0 8px 26px rgba(20,40,30,.22)}
  .card h2{margin:0 0 10px;font-size:15px;color:#1f5a4c}

  button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:14px 16px;cursor:pointer;
    touch-action:manipulation;transition:transform .06s,filter .15s;color:inherit}
  button:active:not(:disabled){transform:scale(.97)}
  button:disabled{opacity:.4;cursor:default}
  .primary{background:linear-gradient(135deg,#2c9a84,#1f7a6a);color:#fff;width:100%;font-size:17px;box-shadow:0 6px 16px rgba(31,122,106,.35)}
  .ghost{background:#e7f2ed;color:#1f5a4c;width:100%}
  .rulesbig{background:linear-gradient(135deg,#ffe7a8,#f6c84c);color:#5a3d00;width:100%;font-size:17px;box-shadow:0 5px 14px rgba(160,110,0,.25)}
  .row{display:flex;gap:8px}
  .row>*{flex:1}

  input{font:inherit;width:100%;padding:14px;border-radius:14px;border:2px solid #d6e7df;background:#fff;color:#22423a;font-weight:700;text-align:center}
  input:focus{outline:0;border-color:#1f7a6a}
  #code{letter-spacing:10px;font-size:26px;font-weight:900;padding-left:10px}
  .codebox{text-align:center;background:linear-gradient(135deg,#f3fbf7,#dff0e8);border-radius:16px;padding:14px}
  .codebox .n{font-size:40px;font-weight:900;letter-spacing:8px;color:#1f7a6a;padding-left:8px}
  .codebox .t{font-size:12px;font-weight:700;color:#5f8a7e}
  .muted{color:#5f8a7e;font-size:12.5px;font-weight:700;text-align:center;margin:0}
  .dots::after{content:'';animation:d 1.2s steps(4,end) infinite}
  @keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  .hide{display:none!important}
  a.back{display:block;text-align:center;color:#ffffffd0;font-size:12px;font-weight:700;text-decoration:none;padding:4px}
  .suits{display:flex;justify-content:center;gap:6px;margin:2px 0 10px;font-size:22px}

  /* 알림 (위에 떠서 화면을 밀지 않는다) */
  #err{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:40;width:calc(100% - 32px);max-width:408px;
    background:#3a2410;color:#fff2dc;border-radius:14px;padding:11px 14px;font-size:13.5px;font-weight:800;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}

  /* ---- 카드 색 ---- */
  .s0{--c:#f6c84c;--k:#5c3f00;--e:#d9a520}
  .s1{--c:#3d8be0;--k:#fff;--e:#2a6cb8}
  .s2{--c:#3fa45b;--k:#fff;--e:#2c8044}
  .s3{--c:#e0533d;--k:#fff;--e:#b73b28}
  .s4{--c:#f5f7fb;--k:#3d4a63;--e:#9aa7b8}

  /* ---- 게임 ---- */
  .gbar{display:flex;align-items:center;gap:8px}
  .gbar .t{flex:1;font-size:12.5px;font-weight:800;color:#3b2a10;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini{width:auto;padding:7px 11px;font-size:13px;border-radius:11px;background:#fffbe9;color:#5a3d00;box-shadow:0 2px 6px rgba(0,0,0,.12)}

  .panel{background:rgba(255,255,255,.94);border-radius:16px;padding:9px 10px;box-shadow:0 6px 18px rgba(20,40,30,.18);border:2px solid transparent}
  .panel.on{border-color:#f0b43c;box-shadow:0 0 0 3px #f6c84c55,0 6px 18px rgba(20,40,30,.18)}
  .phead{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13.5px;color:#1f4a40;margin-bottom:5px}
  .phead .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .phead .cnt{font-size:12px;color:#5f8a7e;font-weight:800;white-space:nowrap}
  .tot{font-size:13px;font-weight:900;padding:2px 8px;border-radius:9px;background:#e7f2ed;color:#1f5a4c;white-space:nowrap}
  .tot.neg{background:#fde3df;color:#c0392b}
  .last{font-size:11.5px;font-weight:800;color:#7a6a4a;margin:-2px 0 4px;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .lines{display:flex;flex-direction:column;gap:3px}
  .ln{display:flex;align-items:center;gap:6px;min-height:22px;border-radius:9px;padding:1px 3px}
  .ln .ic{flex:none;width:26px;height:20px;border-radius:7px;background:var(--c);box-shadow:inset 0 0 0 1.5px var(--e);
    display:flex;align-items:center;justify-content:center;font-size:13px}
  .ln .cs{flex:1;min-width:0;display:flex;gap:2px;align-items:center;overflow:hidden}
  .ln .none{font-size:12px;color:#a9b8b2;font-weight:800}
  .ln .sc{flex:none;min-width:40px;text-align:right;font-size:13px;font-weight:900;color:#1f7a4a}
  .ln .sc.neg{color:#c0392b}
  .ln .sc.zero{color:#7a8a84}
  .ln .sc.idle{color:#c3cfca;font-weight:700}
  /* 상대 줄은 숫자만 나열 */
  .opp .ln .cs{font-size:13px;font-weight:900;color:#2c4a42;gap:5px;white-space:nowrap}
  .opp .ln .cs i{font-style:normal}
  /* 내 줄은 작은 카드 */
  .chip{flex:none;width:21px;height:24px;border-radius:5px;background:var(--c);color:var(--k);box-shadow:inset 0 0 0 1.5px var(--e);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;letter-spacing:-.5px}
  .chip.w{font-size:11px}
  .chip.ghost{opacity:.55;outline:2px dashed var(--e);outline-offset:1px}
  .mine .ln{min-height:28px}
  .mine .ln.focus{background:#fff6d8;box-shadow:inset 0 0 0 2px #f0b43c}
  .mine .ln.focus.bad{background:#fdecea;box-shadow:inset 0 0 0 2px #e79a8f}
  .warn{font-size:11px;margin-left:2px}

  /* 가운데: 버림 더미 5 + 덱 */
  .table{display:flex;gap:5px;align-items:stretch}
  .pile{flex:1;min-width:0;padding:0;border-radius:11px;height:76px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(255,255,255,.35);border:2px dashed rgba(255,255,255,.75);color:#fff}
  .pile .ic{font-size:18px;opacity:.85}
  .pile .n{font-size:10.5px;font-weight:800;position:absolute;bottom:3px;right:5px;opacity:.9}
  .pile.has{background:var(--c);color:var(--k);border:2px solid var(--e);box-shadow:0 3px 0 var(--e)}
  .pile.has .v{font-size:23px;font-weight:900;line-height:1}
  .pile.has .ic{font-size:14px;opacity:1}
  .pile.pickable{animation:glow 1.1s ease-in-out infinite alternate}
  @keyframes glow{from{box-shadow:0 0 0 2px #fff,0 0 8px 3px #ffe58a}to{box-shadow:0 0 0 3px #fff,0 0 16px 6px #ffd84a}}
  .pile.blocked::after{content:'🚫';position:absolute;top:-7px;right:-5px;font-size:15px}
  .pile.blocked{opacity:.65}
  .deck{flex:1.25;min-width:0;padding:0;height:76px;border-radius:11px;position:relative;color:#fff;
    background:repeating-linear-gradient(45deg,#2a6b5c 0 6px,#23594d 6px 12px);border:2px solid #fff;box-shadow:0 3px 0 #173d35;
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  .deck .v{font-size:28px;font-weight:900;line-height:1}
  .deck .l{font-size:10.5px;font-weight:800;opacity:.9;margin-top:2px}
  .deck.low{background:repeating-linear-gradient(45deg,#b8452f 0 6px,#a33a26 6px 12px)}
  .deck.pickable{animation:glow 1.1s ease-in-out infinite alternate}

  /* 안내 띠 */
  .band{display:flex;align-items:center;gap:8px;border-radius:14px;padding:9px 10px;font-weight:800;font-size:13.5px;line-height:1.35;
    background:#fffbe9;color:#5a4420;box-shadow:0 4px 12px rgba(0,0,0,.1);min-height:48px}
  .band.me{background:linear-gradient(135deg,#fff3c4,#ffd98a);color:#5a3d00}
  .steps{flex:none;display:flex;flex-direction:column;gap:3px}
  .steps span{font-size:10.5px;font-weight:900;padding:2px 6px;border-radius:7px;background:#0000000d;color:#0005;white-space:nowrap}
  .steps span.on{background:#1f7a6a;color:#fff}
  .band .msg{flex:1;min-width:0}
  .band .msg b{color:#1f5a4c}
  .band .msg .bad{color:#c0392b}

  /* 손패 */
  .hand{display:flex;gap:4px;justify-content:center;padding-top:8px;min-height:74px}
  .hc{flex:1;max-width:46px;min-width:0;height:64px;padding:0;border-radius:9px;background:var(--c);color:var(--k);
    border:2px solid var(--e);box-shadow:0 3px 0 var(--e);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    transition:transform .12s}
  .hc .ic{font-size:13px;line-height:1}
  .hc .v{font-size:21px;font-weight:900;line-height:1}
  .hc.w .v{font-size:19px}
  .hc.sel{transform:translateY(-8px);box-shadow:0 0 0 3px #fff,0 0 0 5px #1f7a6a,0 6px 10px rgba(0,0,0,.25)}
  .hc{position:relative}
  .hc.new::after{content:'NEW';position:absolute;top:-8px;right:-4px;font-size:8.5px;font-weight:900;background:#ff7a3c;color:#fff;border-radius:5px;padding:1px 3px}
  .hc.cant{filter:saturate(.55) brightness(.97)}
  .acts{display:flex;gap:8px;margin-top:8px}
  .acts button{flex:1;padding:13px 6px;font-size:15px}
  .b-line{background:linear-gradient(135deg,#2c9a84,#1f7a6a);color:#fff}
  .b-line.dim{background:#cfdcd7;color:#6d837c}
  .b-discard{background:#f3e3cf;color:#6a4520}

  .result{text-align:center;padding:4px 0 2px}
  .result .big{font-size:26px;font-weight:900;margin:0}
  .result .vs{font-size:14px;font-weight:800;color:#5f8a7e;margin:4px 0 10px}
  .win .big{color:#1f7a6a} .lose .big{color:#7b6a5a} .draw .big{color:#9a7a2a}
</style>
</head>
<body>
<div id="app">
  <h1>🧭 탐험대</h1>
  <p class="sub" id="sub">작은 숫자부터 탐험로를 이어 점수를 모아요</p>
  <div class="topbar"><button id="b-leave" class="leave hide">방 나가기</button></div>
  <div id="err" class="hide"></div>

  <!-- 1. 시작 -->
  <section id="s-home" class="card hide">
    <div class="suits">🏜️ 🌊 🌲 🌋 🏔️</div>
    <button class="rulesbig" id="b-rules-home">📖 규칙 보기 (처음이면 꼭!)</button>
    <p class="muted" style="margin-top:8px">로스트 시티 방식 · 둘이 하는 카드 게임 · 한 판 15분쯤</p>
    <h2 style="margin-top:18px">방 만들기</h2>
    <input id="name" maxlength="8" placeholder="내 이름 (선택)" autocomplete="off">
    <h2 style="margin:16px 0 8px">누가 먼저 할지</h2>
    <div id="pick-kind"></div>
    <div style="height:12px"></div>
    <button class="primary" id="b-create">새 방 만들기</button>
    <div style="height:8px"></div>
    <button class="ghost" id="b-bot">🤖 혼자 하기 (AI 상대)</button>
    <h2 style="margin-top:22px">코드로 들어가기</h2>
    <input id="code" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
    <div style="height:10px"></div>
    <button class="ghost" id="b-join">들어가기</button>
  </section>

  <!-- 2. 대기 -->
  <section id="s-wait" class="card hide">
    <div class="codebox">
      <div class="t">방 코드</div>
      <div class="n" id="w-code">----</div>
    </div>
    <div style="height:10px"></div>
    <button class="ghost" id="b-share">초대 링크 복사</button>
    <p class="muted" style="margin-top:14px"><span class="dots">상대를 기다리는 중</span></p>
    <div style="height:10px"></div>
    <button class="ghost" id="b-rules-wait">📖 기다리는 동안 규칙 보기</button>
    <p class="muted" style="margin:14px 0 10px;font-size:13px">둘 다 방을 만들었다면 한 명은 나가서 상대 코드로 들어가요</p>
    <button class="ghost" id="b-leave-wait">나가서 다른 코드로 들어가기</button>
  </section>

  <!-- 3. 선 정하기 -->
  <section id="s-pick" class="card hide"><div id="picker"></div></section>

  <!-- 4. 게임 (끝난 뒤에도 판은 남겨서 보여준다) -->
  <section id="s-game" class="hide" style="display:flex;flex-direction:column;gap:8px">
    <div class="gbar"><span class="t" id="g-title"></span><button class="mini" id="b-rules-game">📖 규칙</button></div>

    <div class="panel opp" id="p-opp">
      <div class="phead"><span class="nm" id="o-name">상대</span><span class="cnt" id="o-hand">손패 8장</span><span class="tot" id="o-tot">0점</span></div>
      <div class="last" id="o-last"></div>
      <div class="lines" id="o-lines"></div>
    </div>

    <div class="table" id="table"></div>

    <div class="result card hide" id="d-box">
      <p class="big" id="d-big">—</p>
      <p class="vs" id="d-vs"></p>
      <button class="primary" id="b-again">다시 하기</button>
    </div>
    <div class="band" id="band"><div class="steps"><span id="st1">① 내기</span><span id="st2">② 가져오기</span></div><div class="msg" id="band-msg">—</div></div>

    <div class="panel mine" id="p-me">
      <div class="phead"><span class="nm" id="m-name">내 탐험로</span><span class="tot" id="m-tot">0점</span></div>
      <div class="lines" id="m-lines"></div>
      <div class="hand" id="hand"></div>
      <div class="acts" id="acts">
        <button class="b-line" id="b-line">🧭 탐험로에 놓기</button>
        <button class="b-discard" id="b-discard">🗑️ 버리기</button>
      </div>
    </div>
  </section>

  <a class="back" href="../">← 다른 게임</a>
</div>
<script src="../couple-common/picker.js"></script>
<script src="../couple-common/rules.js"></script>
<script>
/* =========================================================================
   탐험대 — 로스트 시티 방식, 한 라운드.
   흐름: 대기 → 선 정하기(미니게임) → 번갈아 (① 한 장 놓기/버리기 → ② 한 장 가져오기) → 덱이 다 떨어지면 끝
   상태는 서버(POST /api/expedition)가 들고 있고, 여기는 그리기만 한다.
   규칙은 netlify/lib/expedition-core.mjs 가 정답이다. 카드 번호 풀이(col/val)도 거기와 같다.
   ========================================================================= */
const API = '/api/expedition', SAVE = 'couple-expedition', POLL_MS = 1400, POLL_SLOW_MS = 3200;
const $ = (id) => document.getElementById(id);

const SUIT = [
  { ic: '🏜️', name: '사막' }, { ic: '🌊', name: '바다' }, { ic: '🌲', name: '숲' }, { ic: '🌋', name: '화산' }, { ic: '🏔️', name: '설산' },
];
const col = (id) => Math.floor(id / 12);
const val = (id) => { const k = id % 12; return k < 3 ? 0 : k - 1; };
const isW = (id) => id % 12 < 3;
const face = (id) => (isW(id) ? '🤝' : String(val(id)));
const cardName = (id) => SUIT[col(id)].ic + (isW(id) ? '🤝' : val(id));
function lineScore(line) {
  if (!line.length) return 0;
  let sum = 0, w = 0;
  for (const id of line) { if (isW(id)) w++; else sum += val(id); }
  return (sum - 20) * (1 + w) + (line.length >= 8 ? 20 : 0);
}
function lineWhy(line, id) {           // 서버 lineWhy 와 같다 — 누르기 전에 바로 알려주려고
  if (!line.length) return null;
  const top = line[line.length - 1];
  if (isW(id)) return isW(top) ? null : '🤝 내기 카드는 그 색에 숫자를 놓기 전에만 놓을 수 있어요';
  if (isW(top)) return null;
  return val(id) > val(top) ? null : '이미 ' + val(top) + '까지 놓았어요. 더 큰 숫자만 놓을 수 있어요';
}
const signed = (n) => (n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0');

let S = { code: null, token: null, you: null, name: '' };
let st = null;
let timer = null, busy = false;
let sel = null;                        // 고른 손패 카드 id
let lastTurnNo = -1;

/* ------------------------------------------------------------------ 통신 */
async function api(action, extra) {
  const body = { action, code: S.code, token: S.token, ...(extra || {}) };
  let res;
  try {
    res = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  } catch (e) { throw new Error('인터넷이 끊긴 것 같아요'); }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    if (res.status === 404 && !data.error) throw new Error('서버를 찾지 못했어요. 넷리파이에 올린 주소로 열어주세요');
    throw new Error(data.error || '요청이 실패했어요 (' + res.status + ')');
  }
  return data;
}
function adopt(data) {
  if (data.token) S.token = data.token;
  if (data.code) S.code = data.code;
  if (typeof data.you === 'number') S.you = data.you;
  st = data;
  tellOpener();
  save();
  render();
}
/* 탕비실(신영 메신저 lounge.html)이 window.open 으로 이 페이지를 열었으면, 방 코드가 생겼을 때 한 번 알려준다 */
let toldCode = null;
function tellOpener() {
  if (!S.code || toldCode === S.code || !window.opener) return;
  toldCode = S.code;
  try { window.opener.postMessage({ type: 'couple-room', game: SAVE.replace('couple-', ''), code: S.code, you: S.you, name: S.name, bot: !!(st && st.bot) }, '*'); } catch (e) {}
}
function save() {
  try { localStorage.setItem(SAVE, JSON.stringify({ code: S.code, token: S.token, name: S.name })); } catch (e) {}
}
function forget() {
  try { localStorage.removeItem(SAVE); } catch (e) {}
  S = { code: null, token: null, you: null, name: S.name };
  st = null;
}
function err(msg) {
  const e = $('err');
  if (!msg) { e.classList.add('hide'); return; }
  e.textContent = msg; e.classList.remove('hide');
  clearTimeout(err.t); err.t = setTimeout(() => e.classList.add('hide'), 3800);
}
async function act(fn) {
  if (busy) return;
  busy = true;
  try { await fn(); err(null); } catch (e) { err(e.message); } finally { busy = false; }
}

/* ------------------------------------------------------------------ 폴링 */
function poll() {
  clearTimeout(timer);
  const gap = st && st.phase === 'done' ? POLL_SLOW_MS : POLL_MS;
  timer = setTimeout(async () => {
    if (S.code && S.token && document.visibilityState === 'visible' && !busy) {
      const tok = S.token;   // 기다리는 사이 방을 나갔으면 받은 답을 버린다
      try { const d = await api('state'); if (S.token === tok) adopt(d); } catch (e) {}
    }
    poll();
  }, gap);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.code) act(async () => adopt(await api('state')));
});

/* -------------------------------------------------------------- 소리 한 톨 */
let AC = null;
function beep(hi) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = 'triangle';
    o.frequency.setValueAtTime(hi ? 660 : 440, t);
    o.frequency.exponentialRampToValueAtTime(hi ? 520 : 360, t + 0.08);
    g.gain.setValueAtTime(0.07, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.14);
  } catch (e) {}
}

/* -------------------------------------------------------------- 판 뼈대 — 한 번만 만든다
   폴링 때마다 버튼을 새로 만들면 누르는 도중에 바뀌어서 탭이 씹힌다. 내용만 갈아끼운다. */
const setHTML = (el, h) => { if (el._h !== h) { el._h = h; el.innerHTML = h; } };
const el = (tag, cls, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; };
function makeLines(root) {
  return SUIT.map((s, c) => {
    const row = el('div', 'ln s' + c, root);
    const ic = el('span', 'ic', row); ic.textContent = s.ic; ic.title = s.name;
    return { row, cs: el('span', 'cs', row), sc: el('span', 'sc', row) };
  });
}
const oppRows = makeLines($('o-lines')), myRows = makeLines($('m-lines'));

const piles = SUIT.map((s, c) => {
  const b = el('button', 'pile s' + c, $('table'));
  b.type = 'button';
  b.setAttribute('aria-label', s.name + ' 버림 더미');
  b.onclick = () => tapPile(c);
  return b;
});
const deckBtn = el('button', 'deck', $('table'));
deckBtn.type = 'button';
deckBtn.onclick = () => tapDeck();

const handBtns = [...Array(8)].map(() => {
  const b = el('button', 'hc', $('hand'));
  b.type = 'button';
  b.onclick = () => tapHand(b);
  return b;
});

/* -------------------------------------------------------------- 누르기 */
const myTurn = () => st && st.phase === 'play' && st.yourTurn;
function tapHand(b) {
  const id = Number(b.dataset.id);
  if (!st || st.phase !== 'play' || Number.isNaN(id)) return;
  sel = sel === id ? null : id;
  if (myTurn() && st.step === 'draw') err('이번 차례엔 이미 냈어요. 이제 덱이나 버림 더미에서 한 장 가져와요');
  render();
}
function playSel(to) {
  if (!myTurn()) { err(st && st.phase === 'play' ? '상대 차례예요. 기다려 주세요' : '지금은 낼 수 없어요'); return; }
  if (st.step !== 'play') { err('이미 냈어요. 이제 덱이나 버림 더미에서 한 장 가져와요'); return; }
  if (sel === null) { err('먼저 아래 손패에서 카드를 한 장 눌러 골라요'); return; }
  if (to === 'line') { const why = lineWhy(st.lines.me[col(sel)], sel); if (why) { err(why + ' — 버리기만 할 수 있어요'); return; } }
  const card = sel;
  act(async () => { beep(true); const d = await api('play', { card, to }); sel = null; adopt(d); });
}
function tapPile(c) {
  if (!st || st.phase !== 'play') return;
  if (!myTurn()) { err('상대 차례예요. 버림 더미 맨 위 카드는 누구나 가져갈 수 있어요'); return; }
  if (st.step === 'play') { err('① 먼저 손패에서 카드를 골라 놓거나 버려요. 가져오기는 그다음이에요'); return; }
  if (st.blocked === c) { err('방금 버린 카드는 바로 다시 가져올 수 없어요'); return; }
  if (!st.pileCount[c]) { err('그 버림 더미는 비어 있어요. 덱에서 가져와요'); return; }
  act(async () => { beep(false); adopt(await api('draw', { from: c })); });
}
function tapDeck() {
  if (!st || st.phase !== 'play') return;
  if (!myTurn()) { err('상대 차례예요'); return; }
  if (st.step === 'play') { err('① 먼저 손패에서 카드를 골라 놓거나 버려요. 가져오기는 그다음이에요'); return; }
  act(async () => { beep(false); adopt(await api('draw', { from: 'deck' })); });
}
$('b-line').onclick = () => playSel('line');
$('b-discard').onclick = () => playSel('discard');

/* -------------------------------------------------------------- 선 정하기 */
const chooser = Picker.chooser($('pick-kind'));
const ackKey = () => SAVE + ':pick:' + st.code + ':' + st.round;
const acked = () => { try { return sessionStorage.getItem(ackKey()) === '1'; } catch (e) { return false; } };
const picker = Picker.mount($('picker'), {
  onThrow: (v) => act(async () => { beep(false); adopt(await api('throw', { value: v })); }),
  onDone: () => { try { sessionStorage.setItem(ackKey(), '1'); } catch (e) {} render(); },
});

/* ------------------------------------------------------------------ 그리기 */
function show(id) {
  ['s-home', 's-wait', 's-pick', 's-game'].forEach((s) => $(s).classList.toggle('hide', s !== id));
  $('b-leave').classList.toggle('hide', id === 's-home');
}
const meName = () => (st && st.name) || S.name || '나';
const youName = () => (st && st.opponent.name) || '상대';
const jo = Picker.jo;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function scoreCell(cell, line, sc) {
  const started = line.length > 0;
  cell.className = 'sc' + (!started ? ' idle' : sc < 0 ? ' neg' : sc === 0 ? ' zero' : '');
  setHTML(cell, !started ? '·' : sc < 0 ? '<span class="warn">⚠️</span>' + signed(sc) : signed(sc));
}
function drawOpp() {
  oppRows.forEach((r, c) => {
    const line = st.lines.them[c];
    setHTML(r.cs, line.length ? line.map((id) => '<i>' + face(id) + '</i>').join('') : '<span class="none">—</span>');
    scoreCell(r.sc, line, st.lineScores.them[c]);
  });
  $('o-name').textContent = youName();
  $('o-hand').textContent = '🂠 ' + st.oppHand + '장';
  const t = st.score.them;
  $('o-tot').textContent = signed(t) + '점';
  $('o-tot').className = 'tot' + (t < 0 ? ' neg' : '');
  $('p-opp').classList.toggle('on', st.phase === 'play' && !st.yourTurn);
  // 상대가 방금 한 일
  const opp = 1 - S.you, mine = [];
  for (let i = st.log.length - 1; i >= 0 && st.log[i].by === opp; i--) mine.unshift(st.log[i]);
  const say = (e) => e.t === 'line' ? cardName(e.card) + ' 탐험로에 놓음'
    : e.t === 'discard' ? cardName(e.card) + ' 버림'
    : e.from === 'deck' ? '덱에서 가져감' : SUIT[e.from].ic + ' 버림 더미에서 ' + cardName(e.card) + ' 가져감';
  setHTML($('o-last'), mine.length ? '방금: ' + mine.map(say).join(' → ') : '');
}
function drawTable() {
  const drawing = myTurn() && st.step === 'draw';
  piles.forEach((b, c) => {
    const top = st.piles[c], n = st.pileCount[c];
    b.classList.toggle('has', top !== null);
    b.classList.toggle('blocked', st.blocked === c && st.phase === 'play');
    b.classList.toggle('pickable', drawing && top !== null && st.blocked !== c);
    setHTML(b, top === null ? '<span class="ic">' + SUIT[c].ic + '</span>'
      : '<span class="ic">' + SUIT[c].ic + '</span><span class="v">' + face(top) + '</span><span class="n">' + n + '장</span>');
  });
  deckBtn.classList.toggle('pickable', drawing);
  deckBtn.classList.toggle('low', st.deck <= 6);
  setHTML(deckBtn, '<span class="v">' + st.deck + '</span><span class="l">덱 남은 장</span>');
}
function drawMine() {
  const focus = sel !== null ? col(sel) : -1;
  const why = sel !== null ? lineWhy(st.lines.me[focus], sel) : null;
  myRows.forEach((r, c) => {
    const line = st.lines.me[c];
    let h = line.map((id) => '<span class="chip' + (isW(id) ? ' w' : '') + '">' + face(id) + '</span>').join('');
    if (c === focus && !why && st.phase === 'play') h += '<span class="chip ghost' + (isW(sel) ? ' w' : '') + '">' + face(sel) + '</span>';
    if (!h) h = '<span class="none">아직 시작 안 함</span>';
    setHTML(r.cs, h);
    scoreCell(r.sc, line, st.lineScores.me[c]);
    r.row.classList.toggle('focus', c === focus && st.phase === 'play');
    r.row.classList.toggle('bad', c === focus && !!why);
  });
  $('m-name').textContent = meName() + ' · 내 탐험로';
  const t = st.score.me;
  $('m-tot').textContent = signed(t) + '점';
  $('m-tot').className = 'tot' + (t < 0 ? ' neg' : '');
  $('p-me').classList.toggle('on', myTurn());

  // 손패 — 방금 덱/더미에서 가져온 카드에 NEW
  let fresh = null;
  for (let i = st.log.length - 1; i >= 0; i--) { const e = st.log[i]; if (e.by === S.you) { if (e.t === 'draw') fresh = e.card; break; } }
  if (sel !== null && !st.hand.includes(sel)) sel = null;
  const playing = myTurn() && st.step === 'play';
  handBtns.forEach((b, i) => {
    const id = st.hand[i];
    if (id === undefined) { b.classList.add('hide'); b.dataset.id = ''; return; }
    b.classList.remove('hide');
    b.dataset.id = id;
    b.className = 'hc s' + col(id) + (isW(id) ? ' w' : '') + (id === sel ? ' sel' : '') + (id === fresh && st.phase === 'play' ? ' new' : '')
      + (playing && !st.canLine.includes(id) ? ' cant' : '');
    setHTML(b, '<span class="ic">' + SUIT[col(id)].ic + '</span><span class="v">' + face(id) + '</span>');
  });
  $('acts').classList.toggle('hide', st.phase !== 'play');
  const canPlay = playing && sel !== null;
  $('b-line').classList.toggle('dim', !canPlay || !!why);
  $('b-discard').disabled = false;
  $('b-discard').style.opacity = canPlay ? 1 : 0.55;
}
function drawBand() {
  const b = $('band'), m = $('band-msg');
  const my = myTurn();
  b.className = 'band' + (my ? ' me' : '');
  $('st1').classList.toggle('on', st.step === 'play');
  $('st2').classList.toggle('on', st.step === 'draw');
  let h;
  if (!my) {
    h = '<span class="dots">' + esc(jo(youName(), '이', '가')) + (st.step === 'draw' ? ' 한 장 가져가는 중' : ' 카드를 내는 중') + '</span>';
  } else if (st.step === 'draw') {
    h = '② 이제 <b>한 장 가져와요</b> — 덱(뭐가 나올지 몰라요)이나 반짝이는 버림 더미 맨 위';
  } else if (sel === null) {
    h = '① 손패에서 카드를 <b>한 장 골라</b> 탐험로에 놓거나 버려요';
  } else {
    const c = col(sel), line = st.lines.me[c], why = lineWhy(line, sel);
    if (why) h = '<span class="bad">' + cardName(sel) + ' — 탐험로에 못 놓아요.</span> ' + esc(why.replace(/^🤝 /, '')) + '. 버릴 수만 있어요';
    else {
      const before = lineScore(line), after = lineScore(line.concat([sel]));
      h = cardName(sel) + ' 놓으면 ' + SUIT[c].name + ' ' + (line.length ? signed(before) : '0') + ' → <b>' + signed(after) + '점</b>'
        + (!line.length ? ' (새로 시작! 숫자 합 20을 넘겨야 플러스)' : '') + ' · 아니면 버리기';
    }
  }
  if (st.deck <= 6) h += ' <span class="bad">· 덱 ' + st.deck + '장 남음!</span>';
  setHTML(m, h);
}

function render() {
  if (!st) { show('s-home'); $('sub').textContent = '작은 숫자부터 탐험로를 이어 점수를 모아요'; return; }

  if (st.phase === 'wait') {
    show('s-wait');
    $('sub').textContent = '방 코드를 알려주고 같이 들어와요';
    $('w-code').textContent = st.code;
    return;
  }

  if (st.phase === 'pick' || (st.phase === 'play' && st.turnNo === 0 && st.step === 'play' && !acked())) {
    show('s-pick');
    $('sub').textContent = '방 ' + st.code + ' · 누가 먼저 할까요';
    picker.update(st.pick, { you: S.you, meName: meName(), youName: youName(), round: st.round,
      extra: (meFirst) => (meFirst ? '내가 먼저 카드를 내요' : jo(youName(), '이', '가') + ' 먼저 카드를 내요') + ' · 각자 8장으로 시작' });
    return;
  }

  show('s-game');
  $('sub').textContent = '방 ' + st.code + ' · ' + meName() + ' vs ' + youName();
  $('g-title').textContent = st.phase === 'done' ? '탐험 끝!' : (st.yourTurn ? '🟢 내 차례' : '⏳ ' + youName() + ' 차례');

  if (st.phase === 'play') {
    $('d-box').classList.add('hide'); $('band').classList.remove('hide');
    if (st.turnNo !== lastTurnNo) {
      if (lastTurnNo >= 0 && st.turnNo > lastTurnNo && st.yourTurn) beep(false);   // 상대가 차례를 마쳤다
      lastTurnNo = st.turnNo;
    }
  } else {
    $('band').classList.add('hide'); $('d-box').classList.remove('hide');
    sel = null;
    const kind = st.winner === 'draw' ? 'draw' : st.winner === S.you ? 'win' : 'lose';
    $('d-box').className = 'result card ' + kind;
    $('d-big').textContent = kind === 'win' ? '🎉 이겼어요!' : kind === 'lose' ? '졌어요…' : '비겼어요!';
    $('d-vs').textContent = meName() + ' ' + signed(st.score.me) + '점 : ' + signed(st.score.them) + '점 ' + youName() + ' · 덱이 다 떨어졌어요';
    lastTurnNo = -1;
  }
  drawOpp();
  drawTable();
  drawMine();
  if (st.phase === 'play') drawBand();
}

  poll();
});
$('b-again').onclick = () => act(async () => { sel = null; adopt(await api('restart', { round: st.round })); });
$('b-share').onclick = async () => {
  const url = location.origin + location.pathname + '?code=' + st.code;
  const text = '탐험대 한 판! 방 코드 ' + st.code + '\n' + url;
  try {
    if (navigator.share) { await navigator.share({ title: '탐험대', text: '방 코드 ' + st.code, url }); return; }
    await navigator.clipboard.writeText(text);
    $('b-share').textContent = '복사했어요 ✓';
    setTimeout(() => ($('b-share').textContent = '초대 링크 복사'), 1800);
  } catch (e) { err('복사가 안 돼요. 방 코드 ' + st.code + ' 를 알려주세요'); }
};
['name', 'code'].forEach((id) => $(id).addEventListener('keydown', (e) => {
  if (e.key === 'Enter') $(id === 'code' ? 'b-join' : 'b-create').click();
}));

/* 방 나가기 — 방은 그대로 두고(12시간 뒤 만료) 이 폰에서만 잊는다 */
function leave() {
  if (st && st.phase !== 'wait' && st.phase !== 'done' && !confirm('방에서 나갈까요?\n하던 판은 여기서 끝나요')) return;
  clearTimeout(timer);
  forget(); sel = null; lastTurnNo = -1;
  history.replaceState(null, '', location.pathname);
  $('code').value = '';
  render();
  $('code').focus();
}
$('b-leave').onclick = leave;
$('b-leave-wait').onclick = leave;

/* ------------------------------------------------------------------ 시작 */
(async function boot() {
  show('s-home');
  const urlCode = new URLSearchParams(location.search).get('code');
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(SAVE) || 'null'); } catch (e) {}
  if (saved && saved.name) { S.name = saved.name; $('name').value = saved.name; }
  const urlName = (new URLSearchParams(location.search).get('name') || '').trim().slice(0, 8);
  if (urlName && !$('name').value) { S.name = urlName; $('name').value = urlName; }   // 탕비실 등에서 이름을 넘겨준 경우

  if (saved && saved.code && saved.token && (!urlCode || urlCode === saved.code)) {
    S.code = saved.code; S.token = saved.token;
    try { adopt(await api('state')); poll(); return; } catch (e) { forget(); }
  }
  if (new URLSearchParams(location.search).get('bot') === '1') {   // 탕비실 '혼자 하기' — 바로 AI 방을 만든다
    history.replaceState(null, '', location.pathname);
    render();
    createRoom(true);
    return;
  }
  if (urlCode && /^\d{4}$/.test(urlCode)) {
    $('code').value = urlCode;
    $('sub').textContent = '초대받은 방 ' + urlCode + ' · 이름을 넣고 들어가요';
  }
  render();
})();
</script>
</body>
