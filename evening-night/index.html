<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;

  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #stage{position:relative;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16))}
  canvas{width:100%;height:100%;display:block;box-shadow:0 20px 60px #0004;
    touch-action:none;user-select:none;-webkit-user-select:none}
  #touch{position:absolute;inset:0;display:none;pointer-events:none}
  .pad{position:absolute;pointer-events:auto;user-select:none;-webkit-user-select:none;
    touch-action:none;-webkit-touch-callout:none;border-radius:50%;
    background:rgba(255,255,255,0.30);border:2px solid rgba(255,255,255,0.55);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#4a3550;text-align:center;line-height:1.15}
  .pad:active{background:rgba(255,176,58,0.8);border-color:#ff9c4a}
  .btn{width:60px;height:60px;font-size:12px}
  #bF{background:rgba(255,240,180,0.6);border-color:#ffd166;display:none}
  .pad.ready{background:rgba(255,209,102,0.8);border-color:#ff9c4a}
  body.touch #touch{display:block}
  body.coop #bF{display:flex}

  /* 한 손가락 방향 조이스틱 — 기능 버튼 반대편에 둔다 */
  #stick{position:absolute;display:none;pointer-events:auto;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    border-radius:50%;background:rgba(255,255,255,0.22);border:2px solid rgba(255,255,255,0.5)}
  #stick.on{background:rgba(255,209,102,0.28);border-color:#ffb03a}
  #knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;
    border-radius:50%;pointer-events:none;transition:transform .09s ease-out;
    background:rgba(255,255,255,0.66);border:2px solid rgba(255,255,255,0.9);
    box-shadow:0 2px 8px rgba(0,0,0,0.18)}
  #stick.on #knob{background:rgba(255,176,58,0.92);border-color:#ff9c4a;transition:none}
  body.touch #stick{display:block}

  /* 세로 — 게임 화면 아래 빈 공간, 기본은 왼손(기능 버튼 왼쪽 · 스틱 오른쪽) */
  @media (orientation:portrait){
    body.touch #touch{position:fixed;inset:0}
    body.touch .btn{width:19vw;height:19vw;font-size:3.3vw}
    body.touch #bZ{left:5vw;  bottom:6vh}
    body.touch #bX{left:27vw; bottom:6vh}
    body.touch #bF{left:5vw;  bottom:calc(6vh + 21vw);width:16vw;height:16vw;font-size:2.9vw}
    body.touch #stick{right:5vw; bottom:5vh; width:25vw; height:25vw}
    body.touch #bJ{right:8vw; bottom:calc(5vh + 27vw);font-size:5vw}
    body.touch.righty #bZ{left:auto;right:5vw}
    body.touch.righty #bX{left:auto;right:27vw}
    body.touch.righty #bF{left:auto;right:5vw}
    body.touch.righty #stick{right:auto;left:4vw}
    body.touch.righty #bJ{right:auto;left:12vw}
  }
  /* 가로 — 게임 위에 얹되 양쪽 구석으로 */
  @media (orientation:landscape){
    body.touch .btn{height:23%;width:auto;aspect-ratio:1;font-size:clamp(9px,1.8vh,14px)}
    body.touch #bZ{left:2%; bottom:5%}
    body.touch #bX{left:16%;bottom:5%}
    body.touch #bF{left:2%; bottom:33%;height:19%}
    body.touch #stick{right:3%;bottom:6%;height:30%;width:auto;aspect-ratio:1}
    body.touch #bJ{right:5%;bottom:40%;height:19%;font-size:clamp(11px,2.2vh,17px)}
    body.touch.righty #bZ{left:auto;right:2%}
    body.touch.righty #bX{left:auto;right:16%}
    body.touch.righty #bF{left:auto;right:2%}
    body.touch.righty #stick{right:auto;left:2%}
    body.touch.righty #bJ{right:auto;left:6%}
  }
</style>

/* Safari 16.4 이전(구형 iOS)에는 roundRect 가 없어서 화면이 통째로 안 그려진다 */
if(typeof CanvasRenderingContext2D!=='undefined' && !CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    let rr = (typeof r==='number') ? r : (Array.isArray(r)? (r[0]||0) : 0);
    rr = Math.min(rr, Math.abs(w)/2, Math.abs(h)/2);
    this.moveTo(x+rr,y);
    this.arcTo(x+w,y,   x+w,   y+h, rr);
    this.arcTo(x+w,y+h, x,     y+h, rr);
    this.arcTo(x,  y+h, x,     y,   rr);
    this.arcTo(x,  y,   x+w,   y,   rr);
    this.closePath(); return this; };
}

/* 시트에 아직 없는 행을 그리면 투명하게 나와서 캐릭터가 통째로 사라진다.
   행 수를 세어보고 모자라면 alt 로 미리 갈아끼운다. 그림이 추가되면 저절로 새 행을 쓴다. */
function fitSheets(){
  const h=ART.hero;
  if(h.img&&h.img.naturalHeight){ const rows=Math.floor(h.img.naturalHeight/h.frameH);
    for(const k in h.anims){ const an=h.anims[k];
      if(an.alt&&an.row>=rows){ const b=h.anims[an.alt]; h.anims[k]={row:b.row,n:b.n,fps:an.fps}; } } }
  if(MOBART.img&&MOBART.img.naturalHeight){ const rows=Math.floor(MOBART.img.naturalHeight/MOBART.cell);
    for(const k in MOBART){ const s=MOBART[k]; if(!s||!s.alt)continue;
      for(const r of ['idle','walk','face']) if(s[r]>=rows) s[r]=s.alt[r]; } }   // 행 단위로 갈아끼운다
}
[ART.hero.img,MOBART.img].forEach(im=>{ if(im&&im.addEventListener)im.addEventListener('load',fitSheets); });

/* ------------------------------------------------------------------ 입력 */
const keys={},hit={};
const P1=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS',
  'KeyZ','KeyX','KeyC','KeyV','KeyH','Space','Enter','KeyR','Escape']);
let fairyPress=false, coop=false;
addEventListener('keydown',e=>{
  const c=e.code;
  if(P1.has(c)){ e.preventDefault(); usingTouch=false; nav=null; if(!keys[c])hit[c]=true; keys[c]=true;
    if(coop&&mode==='play'&&c==='Enter')fairyPress=true; return; }
  if(coop&&mode==='play'&&/^(Key|Digit|Numpad)/.test(c)||
     ['ShiftRight','Comma','Period','Slash','Semicolon','Quote','BracketLeft','BracketRight'].includes(c)){
    if(coop&&mode==='play'){ e.preventDefault(); fairyPress=true; } }
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
function pad(id,code){ const el=document.getElementById(id); if(!el)return;
  const on=ev=>{ev.preventDefault(); if(code==='FAIRY'){fairyPress=true;return;}
    if(!keys[code])hit[code]=true; keys[code]=true;};
  const off=ev=>{ev.preventDefault(); if(code!=='FAIRY')keys[code]=false;};
  ['touchstart','mousedown'].forEach(t=>el.addEventListener(t,on,{passive:false}));
  ['touchend','touchcancel','mouseup','mouseleave'].forEach(t=>el.addEventListener(t,off));}
const COARSE=matchMedia('(pointer:coarse)').matches;
if(COARSE) document.body.classList.add('touch');

/* 캐릭터 기준 탭·꾹눌러 이동 (모바일/마우스 공용) */
let nav=null, usingTouch=false, righty=false;
try{ righty = localStorage.getItem('handed')==='R'; }catch(e){}
applyHand();   // 선언보다 먼저 부르면 righty 가 TDZ 라 try/catch 에 삼켜진다. 순서 유지.
function applyHand(){ try{ document.body.classList.toggle('righty',righty);
  localStorage.setItem('handed',righty?'R':'L'); }catch(e){} }
function toCanvas(cx,cy){ const r=CV.getBoundingClientRect();
  return {x:(cx-r.left)/r.width*W, y:(cy-r.top)/r.height*H}; }
function navPoint(cx,cy){ const q=toCanvas(cx,cy);
  return {wx:camX+q.x, wz:clamp(q.y,FLOOR_TOP,FLOOR_BOT)}; }
function titleTap(x,y){
  if(y>276&&y<320){ menu=0; startPick(); }
  else if(y>324&&y<368){ menu=1; startPick(); }
  else if(y>372&&y<414){ menu=2; righty=!righty; applyHand(); snd('sparkle'); } }
function navStart(cx,cy){
  usingTouch=true;
  if(mode==='title'){ const q=toCanvas(cx,cy); titleTap(q.x,q.y); return; }
  if(mode==='end'){ mode='title'; banner=null; return; }
  if(mode!=='play')return;
  const q=navPoint(cx,cy); nav={wx:q.wx,wz:q.wz,hold:true,t0:frame,tap:false,exp:0}; }
function navMove(cx,cy){ if(!nav||!nav.hold)return;
  const q=navPoint(cx,cy); nav.wx=q.wx; nav.wz=q.wz; }
function navEnd(){ if(!nav)return;
  if(frame-nav.t0<16){ nav.hold=false; nav.tap=true; nav.exp=frame+200; }
  else nav=null; }
CV.addEventListener('pointerdown',e=>{e.preventDefault();
  if(CV.setPointerCapture)try{CV.setPointerCapture(e.pointerId);}catch(_){}
  navStart(e.clientX,e.clientY);});
CV.addEventListener('pointermove',e=>{ if(nav&&nav.hold){e.preventDefault();navMove(e.clientX,e.clientY);} });
CV.addEventListener('pointerup',e=>{e.preventDefault();navEnd();});
CV.addEventListener('pointercancel',()=>{nav=null;});

/* 한 손가락 조이스틱 — 중심에서 민 방향이 곧 이동 방향 (화면 기준, 캐릭터 기준이 아니다) */
const stick={on:false,mx:0,mz:0,mag:0,id:null};
const STICK_DEAD=0.22;      // 중심 근처는 무시 (손가락을 얹어만 둬도 안 움직인다)
const stickEl=document.getElementById('stick'), knobEl=document.getElementById('knob');
function stickGeom(){ const r=stickEl.getBoundingClientRect();
  return {cx:r.left+r.width/2, cy:r.top+r.height/2, lim:Math.max(1,r.width*0.30)}; }
function stickMove(cx,cy){ if(!stickEl)return;
  const g=stickGeom(); let ox=cx-g.cx, oy=cy-g.cy;
  const d=Math.hypot(ox,oy); if(d>g.lim){ ox*=g.lim/d; oy*=g.lim/d; }
  if(knobEl) knobEl.style.transform='translate('+ox.toFixed(1)+'px,'+oy.toFixed(1)+'px)';
  const nx=ox/g.lim, ny=oy/g.lim, raw=Math.min(1,Math.hypot(nx,ny));
  if(raw<STICK_DEAD){ stick.mx=stick.mz=stick.mag=0; return; }
  const k=((raw-STICK_DEAD)/(1-STICK_DEAD))/raw;      // 데드존만큼 깎고 다시 0~1로 편다
  let ax=nx*k, ay=ny*k;
  if(Math.abs(ay)<Math.abs(ax)*0.36) ay=0;            // 가로로 밀면 위아래는 흘린다
  if(Math.abs(ax)<Math.abs(ay)*0.30) ax=0;
  stick.mx=clamp(ax,-1,1); stick.mz=clamp(ay,-1,1); stick.mag=(raw-STICK_DEAD)/(1-STICK_DEAD); }
function stickHold(cx,cy){ stick.on=true; usingTouch=true; nav=null;
  if(stickEl) stickEl.classList.add('on'); stickMove(cx,cy); }
function stickRelease(){ stick.on=false; stick.id=null; stick.mx=stick.mz=stick.mag=0;
  if(knobEl) knobEl.style.transform='translate(0px,0px)';
  if(stickEl) stickEl.classList.remove('on'); }
if(stickEl){
  stickEl.addEventListener('pointerdown',e=>{ if(stick.on&&stick.id!==e.pointerId)return;
    stick.id=e.pointerId;
    if(stickEl.setPointerCapture)try{stickEl.setPointerCapture(e.pointerId);}catch(_){}
    stickHold(e.clientX,e.clientY); });
  stickEl.addEventListener('pointermove',e=>{
    if(stick.on&&stick.id===e.pointerId) stickMove(e.clientX,e.clientY); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>
    stickEl.addEventListener(t,e=>{ if(stick.id===e.pointerId) stickRelease(); }));
}

const LEFT=()=>keys.ArrowLeft||keys.KeyA||stick.mx<-0.35;
const RIGHT=()=>keys.ArrowRight||keys.KeyD||stick.mx>0.35;
const UPK =()=>keys.ArrowUp||keys.KeyW||stick.mz<-0.35;
const DOWNK=()=>keys.ArrowDown||keys.KeyS||stick.mz>0.35;
let dirLog=[];
function logDir(d){const l=dirLog[dirLog.length-1]; if(l&&l.d===d&&frame-l.f<3)return;
  dirLog.push({d,f:frame}); if(dirLog.length>6)dirLog.shift();}
function cmd(){for(let i=dirLog.length-1;i>0;i--){const a=dirLog[i],b=dirLog[i-1];
  if(a.d===-b.d&&frame-a.f<=18&&a.f-b.f<=20)return a.d;}return 0;}
function dbl(){for(let i=dirLog.length-1;i>0;i--){const a=dirLog[i],b=dirLog[i-1];
  if(a.d===b.d&&frame-a.f<=5&&a.f-b.f<=15)return a.d;}return 0;}

/* ----------------------------------------------------------------- 소리 */
let AC=null;
function unlockAudio(){ try{
  if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
}catch(e){} }
if(document.addEventListener) ['pointerdown','touchstart','keydown','mousedown'].forEach(t=>
  document.addEventListener(t,unlockAudio,{passive:true}));
function snd(t){ try{ if(!AC)AC=new (AudioContext||webkitAudioContext)();
  const now=AC.currentTime;
  const play=(f,f2,d,type,v)=>{const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,now);
    o.frequency.exponentialRampToValueAtTime(f2,now+d);
    g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(0.0001,now+d);
    o.connect(g);g.connect(AC.destination);o.start(now);o.stop(now+d+0.02);};
  if(t==='gi') play(760,1180,0.09,'triangle',0.05);
  else if(t==='gi2'){play(700,1300,0.14,'triangle',0.06); play(1050,1600,0.14,'sine',0.03);}
  else if(t==='blow') play(300,900,0.13,'sine',0.05);
  else if(t==='blow2') play(260,1100,0.2,'sine',0.06);
  else if(t==='pop') play(1300,420,0.06,'sine',0.05);
  else if(t==='hug'){play(520,880,0.2,'sine',0.05);}
  else if(t==='laugh'){[880,1100,1320].forEach((f,i)=>setTimeout(()=>play(f,f*1.3,0.1,'triangle',0.05),i*70));}
  else if(t==='get'){[880,1174,1568].forEach((f,i)=>setTimeout(()=>play(f,f,0.12,'sine',0.05),i*90));}
  else if(t==='sparkle') play(1500,2200,0.07,'sine',0.035);
  else if(t==='song'){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>play(f,f,0.22,'triangle',0.05),i*120));}
  else if(t==='oops') play(420,220,0.22,'sine',0.05);
}catch(e){} }

function actionLabels(){
  const p=player;
  let z='간지럼', x='방울', j='점프';
  if(!p) return {z,x,j};
  if(p.state==='grab'){ z='간지럼'; x='던지기'; j='놓아주기'; }
  else {
    if(grabbable(p)) z='간지럼 · 꾹=안기';
    if(p.prop){ x=PROPS[p.prop].name+' 쓰기'; j='소품 놓기'; }
    else { if(propUnderfoot()) x='줍기';
           if(p.state==='run'&&p.y===0) j='대시'; }
  }
  return {z,x,j};
}
function syncButtons(){
  const p=player; if(!p) return;
  const L=actionLabels();
  const z=(L.z==='간지럼 · 꾹=안기'?'간지럼<br>꾹=안기':'간지럼<br>Z');
  const x=(L.x==='방울'?'방울<br>X':L.x.replace(' 쓰기','')+'<br>X');
  const j=(L.j==='점프'?'↑':L.j==='대시'?'대시<br>↑':L.j.replace('소품 ','')+'<br>↑');
  const sig=z+'|'+x+'|'+j;
  if(sig===syncButtons.last) return; syncButtons.last=sig;
  try{ const g=id=>document.getElementById(id);
    if(g('bZ')){ g('bZ').innerHTML=z; g('bZ').classList.toggle('ready', z.indexOf('꾹')>=0); }
    if(g('bX')){ g('bX').innerHTML=x; g('bX').classList.toggle('ready', x.indexOf('줍기')===0); }
    if(g('bJ')) g('bJ').innerHTML=j;
  }catch(e){}
}
/* ---------------------------------------------------------------- 상태 */
let frame=0,camX=0,camLock=null,lockT=0,sceneIdx=0,waveIdx=0;
let ents=[],player=null,fairy=null,bubbles=[],fx=[],pops=[],items=[],got=[],wprops=[];
let exitOpen=false, searchT=0;
let hitStop=0,shake=0,mode='title',menu=0,banner=null,laughs=0,bgc={},helpOpen=false;

function mk(key,x,z){ const d=CHARS[key];
  return {def:d,key,x,z,y:0,vx:0,vz:0,vy:0,facing:key==='hero'?1:-1,
    mood:0,maxMood:d.mood,state:'idle',st:0,an:'idle',anT:0,act:null,ad:null,hl:[],
    cc:false,chain:null,ci:0,cool:40+Math.random()*50,inv:0,pop:0,foe:key!=='hero',
    gone:false,grabbing:null,grabbedBy:null,gT:0,mash:0,ring:0,heart:0,id:Math.random()};
}
function startPick(){ coop=(menu===1);
  try{document.body.classList.toggle('coop',coop);}catch(e){}
  laughs=0; startScene(0); }
function startScene(i){
  sceneIdx=i;waveIdx=0;ents=[];bubbles=[];fx=[];pops=[];camX=0;camLock=null;
  player=mk('hero',110,455); player.heartMax=100; player.heartNow=100; player.song=0;
  player.prop=null;
  ents.push(player);
  if(coop) fairy={x:player.x-40,z:player.z-30,y:70,cd:0,t:0,pulse:0};
  items=SCENES[i].items.map(([x,z,n,kind])=>({x,z,n,kind,got:false,rev:false,
    carrier:null,waiting:kind==='carry',bob:Math.random()*6}));
  wprops=(SCENES[i].props||[]).map(([x,z,k])=>({x,z,k,taken:false,armed:true,bob:Math.random()*6}));
  got=[]; exitOpen=false; searchT=0; nav=null;
  banner={t:170,big:SCENES[i].name,sub:'숨은 물건 3개를 찾아요'};
  mode='play';
}

/* ------------------------------------------------------------ 웃음 판정 */
function setAn(e,a){ if(e.an!==a){e.an=a;e.anT=0;} }
function start(e,k,tbl){ const a=(tbl||M)[k]; if(!a)return false;
  if(a.cost){ if(player.song<a.cost)return false; player.song-=a.cost; }
  e.state='attack';e.act=k;e.ad=a;e.st=0;e.hl=[];e.cc=false;e.vx=0;e.vz=0;
  setAn(e,a.an||'idle'); if(a.inv)e.inv=Math.max(e.inv,a.su+a.ac+8); return true; }

/* 높이 판정은 일부러 비대칭이다 — 아래로는 제한이 없고 위로만 yTol 까지 닿는다.
   그래야 (1) 바닥에서 떠 있는 심통이한테 손이 안 닿고 (2) 점프해서 때리는 건 그대로 되고
   (3) 뛰어넘는 동안엔 안 맞는다. 대칭으로 만들면 공중 간지럼이 통째로 빗나간다. */
function inR(a,t,d){ if(Math.abs(a.z-t.z)>(d.zTol||28))return false;
  if((t.y||0)-(a.y||0)>(d.yTol||34))return false;
  const dx=(t.x-a.x)*a.facing; return dx>-14&&dx<(d.reach||40)+((t.def.w||26)+a.def.w)*0.4; }

function laugh(t,amt,src,opt){
  opt=opt||{};
  t.mood=Math.min(t.maxMood,t.mood+amt); t.pop=8;
  hitStop=Math.max(hitStop,opt.hs||2); shake=Math.max(shake,(opt.hs||2)*0.35);
  snd(opt.sfx||'gi'); sparkle(t.x,t.z-t.def.r*1.4,'#fff6c4',6);
  if(opt.push) t.vx=(opt.dir||1)*opt.push;
  if(opt.spin) t.spin=18;
  if(opt.hug){ t.heart=70; t.cool=Math.max(t.cool,70); }
  laughs+=amt; player.song=Math.min(100,player.song+amt*0.85);
  if(t.mood>=t.maxMood){ t.state='happy';t.st=0;t.vx=0;t.vz=0;snd('laugh'); }
}
function hurtPlayer(dmg){
  if(player.inv>0||player.state==='sulk')return;
  player.heartNow-=dmg; player.inv=40; player.pop=8; snd('oops');
  player.state='hurt';player.st=0;setAn(player,'oops');
  player.vx=-player.facing*2.2; shake=3;
  if(player.heartNow<=0){ player.heartNow=0; player.state='sulk'; player.st=0;
    setAn(player,'sulk'); player.inv=200; }
}

/* 안아주기 → 빙글빙글 */
function grabbable(e){ let b=null,bd=1e9;
  for(const t of ents){ if(t===e||t.gone||!t.foe||t.state==='happy'||t.grabbedBy)continue;
    if((t.y||0)-(e.y||0)>34)continue;                 // 떠 있는 애는 내려올 때만 안을 수 있다
    const dx=(t.x-e.x)*e.facing,dz=Math.abs(t.z-e.z);
    if(dx>-8&&dx<44+t.def.r*0.6&&dz<26&&dx<bd){b=t;bd=dx;} } return b; }
function doGrab(a,t){ a.grabbing=t;t.grabbedBy=a;a.gT=0;a.state='grab';t.state='held';
  a.st=t.st=0;setAn(a,'hugHold');a.vx=0;snd('hug');t.heart=60; }
function release(a){ const t=a.grabbing; if(!t)return; a.grabbing=null;t.grabbedBy=null;
  a.state='idle';a.st=0;t.state='idle';t.st=0;t.cool=50; }
function toss(a,back){ const t=a.grabbing; if(!t)return; const dir=back?-a.facing:a.facing;
  a.grabbing=null;t.grabbedBy=null; a.state='attack';a.act='TOSS';
  a.ad={an:'hugToss',su:0,ac:0,rc:22};a.st=0;setAn(a,'hugToss');
  t.state='tossed';t.st=0;t.vx=dir*7.5;t.vy=-10.5;t.y=1;t.spin=999;
  snd('blow2'); shake=4; }

/* ------------------------------------------------------------ 플레이어 */
function pIn(){ const p=player;
  if(p.dashT>0){ if(p.y<=0){ p.dashT=0; sparkle(p.x-p.facing*12,p.z-8,'#e9dff2',6); snd('pop'); }
    else { p.dashT--; if(p.dashT%3===0) sparkle(p.x-p.facing*16,p.z-p.y-34,'#dff6ff',2); } }
  if(p.state==='sulk'){ p.st++; p.vx*=0.8;
    if(p.st>150){ p.state='idle';p.st=0;p.heartNow=p.heartMax*0.7;p.inv=90;
      fx.push({k:'ring',x:p.x,z:p.z,t:30,t0:30}); snd('get'); } return; }
  if(p.state==='hurt'||p.state==='tossed')return;
  if(hit.ArrowLeft||hit.KeyA)logDir(-1); if(hit.ArrowRight||hit.KeyD)logDir(1);

  // Z를 꾹 누르고 있으면 안아준다 (짧게 누르면 간지럼)
  if(p.state!=='grab' && keys.KeyZ && p.y===0){
    p.zHold=(p.zHold||0)+1;
    if(p.zHold===GRAB_HOLD && ['idle','walk','run','attack'].includes(p.state)){
      aim(p); const t=grabbable(p);
      if(t){ doGrab(p,t); p.zHold=0; p.ci=0; return; }
      else fx.push({k:'ring',x:p.x,z:p.z,t:18,t0:18}); }
  } else p.zHold=0;

  if(p.state==='grab'){
    if(hit.KeyZ){ const t=p.grabbing; if(t){ laugh(t,M.GH.dmg,p,{hs:3});
        setAn(p,'tickle1');p.anT=0;
        if(t.state==='happy'){p.grabbing=null;t.grabbedBy=null;p.state='idle';} } return; }
    if(hit.KeyX){ toss(p,(p.facing===1&&LEFT())||(p.facing===-1&&RIGHT())); return; }
    if(hit.KeyC||hit.Space){ release(p); return; }   // 점프 버튼 = 놓아주기
    return; }

  if((hit.KeyZ&&keys.KeyX)||(hit.KeyX&&keys.KeyZ)){
    if(p.song>=100&&['idle','walk','run'].includes(p.state)){
      start(p,'SONG');hit.KeyZ=hit.KeyX=false;shake=3;return;} }

  const a=hit.KeyZ?'Z':hit.KeyX?'X':null;
  if(a){
    if(p.y>0){ if(p.state!=='attack')start(p,'JA'); return; }
    if(p.state==='attack'){
      if(!p.cc) return;
      if(p.chain===a&&p.ci<2){ p.ci++; start(p,a+(p.ci+1)); }
      return; }
    if(!['idle','walk','run'].includes(p.state))return;
    aim(p);
    const c=cmd() || (usingTouch&&p.state==='run' ? p.facing : 0);
    if(c){ p.facing=c;dirLog=[];start(p,a==='Z'?'HUG':'BIG');return; }
    if(a==='X'){
      if(p.prop){ if(start(p,'PROP',{PROP:PROPS[p.prop].use})) p.usingProp=p.prop; return; }
      const w=propUnderfoot();                       // 방울 버튼 = 줍기도 겸한다
      if(w){ w.taken=true; p.prop=w.k; snd('get'); sparkle(w.x,w.z-30,'#ffd166',10);
        banner={t:70,big:'',sub:PROPS[w.k].name+' 을(를) 들었어요'}; return; } }
    if(DOWNK()&&a==='X'){ start(p,'LOW');return; }
    p.chain=a;p.ci=0;start(p,a+'1');return; }
  if(hit.KeyV&&['idle','walk','run'].includes(p.state)){
    if(p.prop) dropProp(p);
    else { const w=propUnderfoot();
      if(w){ w.taken=true; p.prop=w.k; snd('get'); sparkle(w.x,w.z-30,'#ffd166',10);
        banner={t:70,big:'',sub:PROPS[w.k].name+' 을(를) 들었어요'}; } }
    return; }
  if(hit.KeyC&&['idle','walk','run'].includes(p.state)){ aim(p);
    const t=grabbable(p); if(t){ doGrab(p,t); return; }
    return; }
  if(hit.Space&&p.y===0&&['idle','walk','run'].includes(p.state)){
    const pr=p.prop; if(pr) dropProp(p);            // 점프하면 들고 있던 소품을 그 자리에 둔다
    const dash=(p.state==='run'&&!pr);              // 달리는 중에 점프 = 대시 (앞으로 쭉)
    p.vy=-(dash?11.4:10.2)*(pr&&PROPS[pr].jump?PROPS[pr].jump:1);
    p.y=0.1;p.state='air';setAn(p,dash?'dash':'jump');
    if(dash){ p.vx=p.facing*p.def.sp*2.6; p.dashT=26; snd('blow2');
      sparkle(p.x-p.facing*14,p.z-26,'#dff6ff',8); shake=2; }
    else snd('sparkle');
    return; }

  if(['idle','walk','run','air'].includes(p.state)){
    let mx=0,mz=0, far=0;
    if(stick.on){ mx=stick.mx; mz=stick.mz; nav=null; }   // 조이스틱이 최우선
    else {
      if(LEFT())mx--; if(RIGHT())mx++; if(UPK())mz--; if(DOWNK())mz++;
      if(!mx&&!mz&&nav){
        if(nav.tap&&frame>nav.exp) nav=null;
        else {
          const dx=nav.wx-p.x, dz=nav.wz-p.z;
          far=Math.hypot(dx,dz*1.4);
          if(far<18){ if(nav.tap) nav=null; }
          else { mx=clamp(dx/44,-1,1); mz=clamp(dz/34,-1,1);
                 if(Math.abs(dx)<12) mx=0; if(Math.abs(dz)<10) mz=0; } } } }
    const run=(dbl()&&mx===dbl())||far>250||stick.mag>0.85, s=p.def.sp*(run?1.7:1);
    if(p.y===0){ p.vx=mx*s;p.vz=mz*p.def.zsp*(run?1.25:1); if(mx)p.facing=Math.sign(mx);
      if(p.state!=='air')p.state=(mx||mz)?(run?'run':'walk'):'idle';
      setAn(p, p.prop ? (p.state==='idle'?'carryIdle':'carryWalk')
                      : (p.state==='idle'?'idle':'walk'));
    }
    else if(p.dashT>0){ if(mx)p.facing=Math.sign(mx); }   // 대시 중엔 속도를 안 깎는다
    else { p.vx=clamp(p.vx+mx*0.25,-s,s); if(mx)p.facing=Math.sign(mx); } }
}

function ai(e){

  const p=player,dx=p.x-e.x,adx=Math.abs(dx),adz=Math.abs(p.z-e.z);

         tx=p.x+e.ring; tz=p.z+(e.ring>0?26:-26); }

}

  else if(e.state==='hurt'){ e.st++;e.vx*=0.82;

        for(const t of ents){ if(!t.foe||t.gone||t.state==='happy'||t.state==='tossed')continue;
          if(e.hl.includes(t.id))continue;

    // 둥실 심통이는 중력을 안 받는다. 공격할 때만 쏙 내려왔다가 다시 떠오른다.
    const d=(e.state==='attack')?e.ad:null;

      X.beginPath();X.moveTo(x+22,base-o.h);X.lineTo(x+22,base-18);X.moveTo(x+36,base-o.h);

    else {X.beginPath();X.arc(x+18,base-14,20,Math.PI,0);X.fill();} }
  else if(k==='market'){ if(o.t===2){X.fillRect(x,base-52,70,10);X.fillStyle=p.acc;
      for(let s=0;s<5;s++){X.beginPath();X.moveTo(x+s*14,base-42);X.lineTo(x+7+s*14,base-30);
        X.lineTo(x+14+s*14,base-42);X.fill();}}
    else {X.fillRect(x,base-o.h,7,o.h);X.fillStyle=p.glow;X.globalAlpha=.8;
      for(let s=1;s<4;s++){X.beginPath();X.arc(x+3,base-o.h+s*16,6,0,7);X.fill();}X.globalAlpha=1;} }
  else if(k==='river'){ if(o.t===0){X.strokeStyle=p.near;X.lineWidth=3;
      for(let s=0;s<7;s++){X.beginPath();X.moveTo(x+s*5,base);
        X.quadraticCurveTo(x+s*5-6,base-o.h*0.7,x+s*5+4,base-o.h);X.stroke();}}
    else {X.beginPath();X.ellipse(x+20,base-6,26,8,0,0,7);X.fill();} }
  else if(k==='bath'){ if(o.t===0){X.beginPath();X.roundRect(x,base-34,54,34,8);X.fill();
      X.fillStyle=p.glow;X.globalAlpha=.5;X.beginPath();X.ellipse(x+27,base-34,26,7,0,0,7);X.fill();X.globalAlpha=1;}
    else {X.globalAlpha=.35;X.fillStyle='#fff';
      for(let s=0;s<3;s++){X.beginPath();X.arc(x+s*18,base-30-s*16,14-s*3,0,7);X.fill();}X.globalAlpha=1;} }
  else { if(o.t===0){X.fillStyle=p.near;X.beginPath();X.roundRect(x,base-42,90,42,10);X.fill();
      X.fillStyle=p.glow;X.globalAlpha=.35;X.beginPath();X.roundRect(x+8,base-52,74,16,8);X.fill();X.globalAlpha=1;}
    else {X.fillStyle=p.glow;X.globalAlpha=.8;
      for(let s=0;s<4;s++)star(x+s*26,base-o.h-s*10,4);X.globalAlpha=1;} } }
function star(x,y,r){X.beginPath();
  for(let i=0;i<10;i++){const a=Math.PI*2*i/10-Math.PI/2,rr=i%2?r*.45:r;
    X[i?'lineTo':'moveTo'](x+Math.cos(a)*rr,y+Math.sin(a)*rr);}X.closePath();X.fill();}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);
  const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

/* ------------------------------------------------------------ 심통이 그리기 */
function drawBlobVector(e,sx,sy,sc){
  const P=e.def.pal, r=e.def.r, m=Math.min(1,e.mood/e.maxMood);
  // 공격 예고: 준비 동작에서 납작하게 눌리고, 판정에서 앞으로 늘어남
  let aw=0,lean=0;
  if(e.state==='attack'&&e.ad){ const d=e.ad;
    if(e.st<=d.su){ aw=(e.st/Math.max(1,d.su))*0.18; }
    else if(e.st<=d.su+d.ac){ aw=-0.14; lean=e.facing*r*0.22; } }
  X.save();X.translate(sx+lean,sy-e.y-r*0.95*sc);X.scale(sc*(1+aw),sc*(1-aw));
  if(e.spin) X.rotate(e.spin>900?frame*0.22:Math.sin(e.spin*0.6)*0.4);
  // 다리
  X.fillStyle=P.dark;
  X.beginPath();X.ellipse(-r*0.42,r*0.9,r*0.24,r*0.16,0,0,7);X.fill();
  X.beginPath();X.ellipse(r*0.42,r*0.9,r*0.24,r*0.16,0,0,7);X.fill();
  // 귀 / 모자
  if(e.def.ears==='cat'){X.fillStyle=P.body;
    X.beginPath();X.moveTo(-r*.7,-r*.55);X.lineTo(-r*.42,-r*1.15);X.lineTo(-r*.12,-r*.72);X.fill();
    X.beginPath();X.moveTo(r*.7,-r*.55);X.lineTo(r*.42,-r*1.15);X.lineTo(r*.12,-r*.72);X.fill();}
  if(e.def.ears==='bear'){X.fillStyle=P.body;
    X.beginPath();X.arc(-r*.66,-r*.66,r*.3,0,7);X.fill();
    X.beginPath();X.arc(r*.66,-r*.66,r*.3,0,7);X.fill();}
  // 몸
  X.fillStyle=P.body;
  if(e.def.fluff){ X.beginPath();
    for(let i=0;i<12;i++){const a=Math.PI*2*i/12,rr=r*(i%2?0.86:1.05);
      X[i?'lineTo':'moveTo'](Math.cos(a)*rr,Math.sin(a)*rr*0.92);}X.closePath();X.fill(); }
  else { X.beginPath();X.ellipse(0,0,r,r*0.94,0,0,7);X.fill(); }
  if(e.def.ears==='cap'){ X.fillStyle=P.dark;
    X.beginPath();X.moveTo(-r*.8,-r*.62);X.quadraticCurveTo(0,-r*1.9,r*.9,-r*.9);
    X.quadraticCurveTo(r*.3,-r*.5,-r*.8,-r*.62);X.fill();
    X.fillStyle='#fff';X.beginPath();X.arc(r*.9,-r*.9,r*.16,0,7);X.fill(); }
  // 얼굴 (큰 눈, 이빨 없음)
  const ey=-r*0.12, ex=r*0.34, er=r*0.22;
  X.fillStyle='#fff';
  if(m>=1||e.heart>0){ X.strokeStyle=P.face;X.lineWidth=r*0.1;X.lineCap='round';
    X.beginPath();X.arc(-ex,ey,er*0.8,Math.PI*1.15,Math.PI*1.85);X.stroke();
    X.beginPath();X.arc(ex,ey,er*0.8,Math.PI*1.15,Math.PI*1.85);X.stroke(); }
  else { X.beginPath();X.arc(-ex,ey,er,0,7);X.fill();X.beginPath();X.arc(ex,ey,er,0,7);X.fill();
    X.fillStyle=P.face; const look=e.facing*er*0.3;
    X.beginPath();X.arc(-ex+look,ey+er*0.15,er*0.5,0,7);X.fill();
    X.beginPath();X.arc(ex+look,ey+er*0.15,er*0.5,0,7);X.fill(); }
  // 볼
  X.fillStyle='rgba(255,150,160,'+(0.2+m*0.45)+')';
  X.beginPath();X.arc(-ex*1.5,ey+r*0.3,r*0.16,0,7);X.fill();
  X.beginPath();X.arc(ex*1.5,ey+r*0.3,r*0.16,0,7);X.fill();
  // 입
  X.strokeStyle=P.face;X.lineWidth=r*0.09;X.lineCap='round';X.beginPath();
  const my=r*0.42;
  if(m<0.34) X.arc(0,my+r*0.16,r*0.26,Math.PI*1.2,Math.PI*1.8);
  else if(m<0.7) X.arc(0,my-r*0.06,r*0.24,Math.PI*0.15,Math.PI*0.85);
  else X.arc(0,my-r*0.16,r*0.34,Math.PI*0.1,Math.PI*0.9);
  X.stroke();
  X.restore();
}

function blobOverlay(e,sx,sy,sc){
  const r=e.def.r, m=Math.min(1,e.mood/e.maxMood);
  if(e.heart>0){ X.fillStyle='#ff8fb4';
    heart(sx, sy-e.y-r*2.2*sc-((70-e.heart)*0.4), 7*sc); }
  if(!e.def.boss&&e.state!=='happy'){ const n=3,fill=Math.round(m*n);
    for(let i=0;i<n;i++){ X.fillStyle=i<fill?'#ffd166':'rgba(255,255,255,0.5)';
      X.beginPath();X.arc(sx-(n-1)*5+i*10, sy-e.y-r*2.05*sc, 3.2,0,7);X.fill(); } }
}
function drawBlob(e){
  const sx=e.x-camX, sy=e.z, sc=(0.85+(e.z-FLOOR_TOP)/(FLOOR_BOT-FLOOR_TOP)*0.25)*(1+e.pop*0.012);

    if(e.state==='attack'&&e.ad){ const d=e.ad;
      if(e.st<=d.su) aw=(e.st/Math.max(1,d.su))*0.16;
      else if(e.st<=d.su+d.ac){ aw=-0.12; lean=e.facing*r*0.22; } }
    const moving=(e.state==='walk'), row=moving?set.walk:set.idle, n=moving?6:4;
    const f=Math.floor(e.anT/(60/(moving?11:7)))%n;

  } else drawBlobVector(e,sx,sy,sc);
  blobOverlay(e,sx,sy,sc);
}
function heart(x,y,s){X.beginPath();X.moveTo(x,y+s*0.7);
  X.bezierCurveTo(x-s*1.4,y-s*0.4,x-s*0.4,y-s*1.2,x,y-s*0.35);
  X.bezierCurveTo(x+s*0.4,y-s*1.2,x+s*1.4,y-s*0.4,x,y+s*0.7);X.fill();}

/* -------------------------------------------------------- 주인공 그리기 */
function pose(e){
  const A={af:[.3,.55],ab:[-.25,.5],lf:[.12,.05],lb:[-.12,.05],lean:0,hip:0};
  const t=e.anT,s=e.state;
  if(s==='idle')      {A.af=[.34+Math.sin(t*.08)*.06,.6];A.ab=[-.3,.55];A.hip=Math.sin(t*.11)*.8;}
  else if(s==='walk'||s==='run'){const k=Math.sin(t*(s==='run'?.42:.28));
    A.lf=[k*.7,.15+Math.max(0,k)*.4];A.lb=[-k*.7,.15+Math.max(0,-k)*.4];
    A.af=[-k*.6,.5];A.ab=[k*.6,.5];A.lean=s==='run'?.16:.05;A.hip=-Math.abs(k)*2;}
  else if(s==='air')  {A.lf=[.9,.9];A.lb=[-.3,.5];A.af=[-.8,.4];A.ab=[1.2,.3];}
  else if(s==='hurt') {A.lean=-.25;A.af=[-.6,.9];A.ab=[-.8,.9];}
  else if(s==='sulk') {A.sit=1;}
  else if(s==='grab') {A.af=[1.4,1.4];A.ab=[1.3,1.3];A.lean=.1;}
  else if(s==='attack'){const d=e.ad,a=d.an||'';
    const ex=e.st<=d.su?(e.st/Math.max(1,d.su))*.6
      :e.st<=d.su+d.ac?1:Math.max(0,1-((e.st-d.su-d.ac)/Math.max(1,d.rc)));
    if(a.startsWith('punch')||a==='dashPunch'||a==='grabAttack'){
      A.af=[1.3*ex+.2,1.4*ex];A.ab=[1.1*ex,1.2*ex];A.lean=.12*ex;
      if(a==='punch3'){A.af=[1.6*ex+.2,1.5*ex];A.ab=[1.5*ex,1.4*ex];}
      if(a==='dashPunch'){A.lean=.3*ex;A.lf=[.6,.1];A.lb=[-.5,.5];A.af=[1.7*ex,1.1*ex];A.ab=[1.6*ex,1.1*ex];}}
    else if(a.startsWith('kick')||a==='dashKick'){ // 비눗방울 불기
      A.af=[1.15*ex+.15,.55];A.ab=[-.4,.7];A.lean=.06*ex;A.blow=ex;}
    else if(a==='jumpAttack'){A.af=[1.5,1.2];A.ab=[1.3,1.1];A.lf=[.7,.5];}
    else if(a==='throw'){A.af=[2.1*(1-e.st/22)+.2,1.4];A.ab=[1.9*(1-e.st/22),1.3];A.lean=.2;}
    else if(a==='special'){const sp=Math.sin(e.st*.5);
      A.af=[-.9+sp*.3,.5];A.ab=[-1.1-sp*.3,.5];A.hip=Math.sin(e.st*.25)*3;A.sing=1;}}
  return A;}
function limb(x0,y0,a1,l1,a2,l2,w,c){const x1=x0+Math.sin(a1)*l1,y1=y0+Math.cos(a1)*l1;
  const x2=x1+Math.sin(a1+a2)*l2,y2=y1+Math.cos(a1+a2)*l2;
  X.strokeStyle=c;X.lineWidth=w;X.lineCap='round';
  X.beginPath();X.moveTo(x0,y0);X.lineTo(x1,y1);X.lineTo(x2,y2);X.stroke();return[x2,y2];}
function drawHero(e){
  const sx=e.x-camX,sy=e.z,sc=0.84+(e.z-FLOOR_TOP)/(FLOOR_BOT-FLOOR_TOP)*0.26;
  X.fillStyle='rgba(90,70,110,0.22)';X.beginPath();

  const A=pose(e),P=e.def.pal;
  X.save();X.translate(sx,sy-e.y);X.scale(e.facing*sc,sc);
  const sheet=ART.hero.img&&ART.hero.img.complete&&ART.hero.anims[e.an];
  if(sheet){const a=ART.hero,an=a.anims[e.an],f=Math.floor(e.anT/(60/(an.fps||14)))%an.n;
    X.drawImage(a.img,f*a.frameW,an.row*a.frameH,a.frameW,a.frameH,-HSZ/2,-HSZ,HSZ,HSZ);}
  else if(A.sit){
    X.strokeStyle=P.leg;X.lineWidth=11;X.lineCap='round';
    X.beginPath();X.moveTo(0,-16);X.lineTo(20,-6);X.stroke();
    X.beginPath();X.moveTo(0,-16);X.lineTo(14,-14);X.lineTo(24,-4);X.stroke();
    X.fillStyle=P.top;X.beginPath();X.roundRect(-10,-46,20,32,7);X.fill();
    X.strokeStyle=P.skin;X.lineWidth=8;X.beginPath();X.moveTo(4,-40);X.lineTo(14,-28);X.stroke();
    X.fillStyle=P.skin;X.beginPath();X.arc(1,-58,12,0,7);X.fill();
    X.fillStyle=P.hair;X.beginPath();X.arc(1,-60,12.5,3.05,6.4);X.fill();
    X.strokeStyle=P.hair;X.lineWidth=2;
    X.beginPath();X.arc(6,-56,2.6,Math.PI*1.15,Math.PI*1.85);X.stroke();
    X.fillStyle='#9fd8ea';X.beginPath();X.ellipse(9,-51,2,4,0,0,7);X.fill();
  } else {
    const hip=-46+A.hip, sh=-72+A.hip*.6;
    X.rotate(-A.lean*.35);
    limb(0,hip,A.lb[0],24,A.lb[1],24,11,shade(P.leg,-20));
    limb(0,sh ,A.ab[0],17,A.ab[1],17,8 ,shade(P.skin,-22));
    X.fillStyle=P.mid;X.beginPath();X.roundRect(-11,sh-2,22,hip-sh+5,6);X.fill();
    X.fillStyle=P.top;X.beginPath();X.roundRect(-12,sh-3,24,13,5);X.fill();
    X.fillStyle=P.acc;X.fillRect(-11,hip-7,22,5);
    const [fx2,fy2]=limb(0,hip,A.lf[0],24,A.lf[1],24,12,P.leg);
    X.fillStyle=P.shoe;X.beginPath();X.ellipse(fx2+2,fy2+1,8,5,0,0,7);X.fill();
    X.fillStyle=P.skin;X.beginPath();X.arc(1,sh-15,12,0,7);X.fill();
    X.fillStyle=P.hair;X.beginPath();X.arc(1,sh-17,12.8,3.05,6.4);X.fill();
    X.fillStyle='#3b2b45';X.beginPath();X.arc(6.5,sh-16,2,0,7);X.fill();
    X.strokeStyle='#3b2b45';X.lineWidth=1.6;X.beginPath();
    X.arc(4,sh-10,3,Math.PI*.1,Math.PI*.8);X.stroke();
    const [hx,hy]=limb(0,sh,A.af[0],17,A.af[1],17,9,P.skin);
    X.fillStyle=shade(P.skin,10);X.beginPath();X.arc(hx,hy,6,0,7);X.fill();
    if(A.blow){ X.globalAlpha=.5+A.blow*.4;X.strokeStyle='#dff6ff';X.lineWidth=2;
      X.beginPath();X.arc(hx+5,hy-2,7*A.blow,0,7);X.stroke();X.globalAlpha=1; }
    if(A.sing){ X.globalAlpha=.9;X.fillStyle='#fff3a8';
      for(let i=0;i<3;i++)star(10+i*9,sh-26-i*10,3.4);X.globalAlpha=1; }
  }
  X.restore();
  // 손에 든 소품
  if(e===player&&e.prop&&PROPART.img.complete&&/^carry/.test(e.an)){
    const a=PROPART[e.prop], C=PROPART.cell, S=40*sc;
    const f=Math.floor(e.anT/8)%a.n;
    X.save(); X.translate(sx+e.facing*30*sc, sy-e.y-44*sc); X.scale(e.facing,1);
    X.drawImage(PROPART.img,f*C,a.row*C,C,C,-S/2,-S/2,S,S); X.restore(); }
  if(e.inv>0&&e.state!=='sulk'&&frame%8<4){X.globalAlpha=.35;X.fillStyle='#fff';
    X.beginPath();X.ellipse(sx,sy-e.y-46*sc,18*sc,48*sc,0,0,7);X.fill();X.globalAlpha=1;}
}

  const b=ents.find(e=>e.def.boss&&!e.gone);
  if(b){ X.fillStyle='#ffffffcc';X.beginPath();X.roundRect(W/2-200,H-44,400,22,11);X.fill();
    X.fillStyle='#ffd166';X.beginPath();
    X.roundRect(W/2-196,H-40,Math.max(8,392*Math.min(1,b.mood/b.maxMood)),14,7);X.fill();
    X.fillStyle='#5b4368';X.font='700 12px system-ui';X.fillText('잠투정 대왕',W/2,H-50); }
  // 들고 있는 소품
  if(player.prop&&PROPART.img.complete){ const a=PROPART[player.prop],C=PROPART.cell;
    X.fillStyle='#ffffffbb';X.beginPath();X.roundRect(16,72,58,58,14);X.fill();
    X.drawImage(PROPART.img,0,a.row*C,C,C,21,77,48,48);
    X.textAlign='center';X.font='700 10px system-ui';X.fillStyle='#6b4a70';
    X.fillText('점프=놓기',45,142); }
  // 한참 못 찾으면 방향을 살짝 알려준다
  if(!exitOpen&&searchT>1400){ const t=nearestItem();
    if(t){ const dir=t.x>player.x?1:-1, ax=dir>0?W-46:46;
      X.globalAlpha=.45+Math.sin(frame*.12)*.35;X.fillStyle='#fff6c4';
      X.textAlign='center';X.font='800 30px system-ui';
      X.fillText(dir>0?'→':'←',ax,H/2); X.globalAlpha=1; } }
  if(exitOpen){ X.globalAlpha=.5+Math.sin(frame*.11)*.4;X.fillStyle='#fff';
    X.textAlign='center';X.font='800 22px system-ui';
    X.fillText('→ 빛으로',W-80,H-40);X.globalAlpha=1; }
  if(coop){ X.textAlign='left';X.font='700 11px system-ui';X.fillStyle='#ffffffcc';
    X.fillText('요정: 아무 키나 (Enter 포함)',18,78); }
}
function drawKeyGuide(){
  const L=actionLabels();
  const rows=[['Z',L.z],['X',L.x],['Space',L.j],['←→↑↓',player&&player.prop?'이동 (같은 방향 두 번 = 달리기)':'이동']];
  X.globalAlpha=.82; X.fillStyle='rgba(255,255,255,0.62)';
  X.beginPath(); X.roundRect(14,H-108,246,94,12); X.fill(); X.globalAlpha=1;
  X.textAlign='left'; 
  rows.forEach((r,i)=>{ const y=H-90+i*21;
    X.font='800 12px system-ui'; X.fillStyle='#6b4a70';
    X.fillText('['+r[0]+']',22,y);
    X.font='700 12px system-ui'; X.fillStyle='#4a3550';
    X.fillText(r[1],78,y); });
  X.font='700 11px system-ui'; X.fillStyle='#8a6f90';
  X.fillText('H  전체 조작법',176,H-90);
}
function drawHelp(){
  X.fillStyle='rgba(40,26,58,0.86)'; X.fillRect(0,0,W,H);
  X.textAlign='center'; X.font='800 26px system-ui'; X.fillStyle='#fff6c4';
  X.fillText('조작법',W/2,60);
  const rows=[
    ['←→↑↓ / WASD','앞뒤 + 위아래로 이동. 같은 방향을 두 번 누르면 달리기'],
    ['Z','간지럼. 세 번까지 이어집니다'],
    ['Z 꾹 누르기','안아 올리기 (가까이 있을 때)'],
    ['안은 뒤 Z / X / Space','간지럼 / 빙글빙글 던지기 / 놓아주기'],
    ['X','비눗방울. 소품 위에서는 줍기, 소품을 들었으면 소품 쓰기'],
    ['↓ + X','바닥으로 굴러가는 낮은 방울'],
    ['Space','점프. 소품을 들고 있으면 그 자리에 내려놓습니다'],
    ['달리다가 Space','대시 — 앞으로 쭉 날아갑니다'],
    ['둥실 심통이','공중에 떠 있어요. 점프해서 간지럽히거나 방울을 불어주세요'],
    ['← → + Z','달려가 껴안기'],
    ['← → + X','커다란 방울 (여러 번 맞습니다)'],
    ['Z + X 동시','노래 — 화면 안의 심통이가 모두 웃습니다 (마음 게이지 100)'],
    ['C / V','안기 / 소품 줍기·놓기 (따로 쓰고 싶을 때)'],
    ['휴대폰','한쪽 동그라미를 밀어 이동 (끝까지 밀면 달리기) · 반대쪽 버튼으로 간지럼·방울·점프'],
    ['둘이 하기','아이는 아무 키나 누르면 요정이 반짝입니다'],
  ];
  // 줄이 늘면 아래 안내와 겹친다. 간격은 남는 높이에 맞춰 자동으로 좁힌다.
  const gap=Math.min(30,(H-150-96)/Math.max(1,rows.length-1));
  rows.forEach((r,i)=>{ const y=96+i*gap;
    X.textAlign='right'; X.font='800 13px system-ui'; X.fillStyle='#ffd166';
    X.fillText(r[0],330,y);
    X.textAlign='left'; X.font='700 13px system-ui'; X.fillStyle='#fff';
    X.fillText(r[1],352,y); });
  X.textAlign='center'; X.font='700 14px system-ui'; X.fillStyle='#ffd9e6';
  X.fillText('숨은 물건 3개를 찾으면 오른쪽 끝에 빛이 생깁니다',W/2,H-48);
  X.font='800 15px system-ui'; X.fillStyle=frame%60<36?'#fff':'#ffffff66';
  X.fillText('H 를 눌러 닫기',W/2,H-22);
}
function drawBanner(){ if(!banner)return; banner.t--;
  const a=Math.min(1,banner.t/25);X.globalAlpha=a;X.textAlign='center';
  if(banner.big){X.font='800 42px system-ui';X.fillStyle='#ffffff55';
    X.fillText(banner.big,W/2+3,H/2+3);X.fillStyle='#fff';X.fillText(banner.big,W/2,H/2);}
  if(banner.sub){X.font='700 20px system-ui';X.fillStyle='#fff6c4';
    X.fillText(banner.sub,W/2,H/2+36);}
  X.globalAlpha=1; if(banner.t<=0)banner=null; }

function drawTitle(){
  const g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#ffd9a0');g.addColorStop(.5,'#ffa88f');g.addColorStop(1,'#8b6f9e');
  X.fillStyle=g;X.fillRect(0,0,W,H);
  X.globalAlpha=.35;X.fillStyle='#fff';
  for(let i=0;i<6;i++){const cx=140+i*140,cy=80+Math.sin(i)*30;
    X.beginPath();X.arc(cx,cy,24,0,7);X.arc(cx+24,cy+4,18,0,7);X.fill();}
  X.globalAlpha=1;X.textAlign='center';
  X.font='800 14px system-ui';X.fillStyle='#7a5570';X.fillText('같이 하는 판',W/2,132);
  X.font='800 46px system-ui';X.fillStyle='#ffffff66';
  X.fillText('어쩐지 좋은 기분이 드는 밤',W/2+3,216);
  X.fillStyle='#fff';X.fillText('어쩐지 좋은 기분이 드는 밤',W/2,213);
  const opt=['혼자 하기','둘이 하기  (어른 + 아이)',
             '버튼 위치:  '+(righty?'오른손잡이 ▶':'◀ 왼손잡이')];
  opt.forEach((t,i)=>{ const y=298+i*48, on=menu===i;
    X.fillStyle=on?'#ffffffee':'#ffffff55';X.beginPath();X.roundRect(W/2-170,y-24,340,40,14);X.fill();
    X.fillStyle=on?'#6b4a70':'#ffffffcc';X.font='800 19px system-ui';X.fillText(t,W/2,y+2);
    if(on){X.fillStyle='#e88b6a';X.fillText('▶',W/2-192,y+2);} });
  X.font='700 13px system-ui';X.fillStyle='#6b4a70';
  X.fillText(COARSE
    ? '줄을 직접 탭해서 고르세요  ·  게임 중엔 '+(righty?'왼쪽':'오른쪽')+' 동그라미를 밀어 이동 (화면을 탭해도 이동)'
    : '↑↓ 로 고르고 ENTER  ·  휴대폰은 줄을 직접 탭  ·  게임 중엔 화면을 탭·꾹 눌러 이동',W/2,452);
  X.fillText('간지럼 Z (꾹 누르면 안기)  ·  방울 X (소품 위에선 줍기)  ·  점프 SPACE (= 소품 놓기)',W/2,478);
  X.fillText('←→+Z 달려가 껴안기  ·  ←→+X 커다란 방울  ·  Z+X 노래  ·  잡은 뒤 X 던지기 / 점프 놓아주기',W/2,502);
  X.font='700 12px system-ui';X.fillStyle='#7a5570';
  X.fillText('아무도 다치지 않아요.  게임 중 H 키를 누르면 조작법이 다시 나옵니다.',W/2,526);
}
function drawEnd(){
  const g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#3f4d86');g.addColorStop(1,'#1d2247');X.fillStyle=g;X.fillRect(0,0,W,H);
  X.fillStyle='#fff6c4';X.globalAlpha=.9;
  for(let i=0;i<40;i++)star((i*137)%W,(i*211)%300+40,2+((i*7)%3));X.globalAlpha=1;
  X.textAlign='center';X.font='800 44px system-ui';X.fillStyle='#fff';
  X.fillText('잘 자요',W/2,H/2-10);
  X.font='700 18px system-ui';X.fillStyle='#ffd166';
  X.fillText('웃음 '+Math.round(laughs)+'번',W/2,H/2+30);
  X.fillText('ENTER 로 처음으로',W/2,H/2+70);
}

/* ---------------------------------------------------------------- 루프 */
function step(){ frame++;
  if(mode==='title'){
    if(hit.ArrowUp||hit.KeyW)menu=(menu+2)%3;
    if(hit.ArrowDown||hit.KeyS)menu=(menu+1)%3;
    if((hit.ArrowLeft||hit.ArrowRight||hit.KeyA||hit.KeyD)&&menu===2){
      righty=!righty; applyHand(); snd('sparkle'); }
    if(hit.Enter||hit.KeyZ){
      if(menu===2){ righty=!righty; applyHand(); snd('sparkle'); } else startPick(); }
    fairyPress=false; return; }
  if(mode==='end'){ if(hit.Enter||hit.KeyZ){mode='title';banner=null;} fairyPress=false; return; }
  if(hit.KeyH){ helpOpen=!helpOpen; }
  if(helpOpen){ return; }
  if(hitStop>0){ hitStop--; upFx(); return; }
  if(player.state!=='sulk'&&player.heartNow<player.heartMax&&frame%45===0)
    player.heartNow=Math.min(player.heartMax,player.heartNow+1);
  tokens(); pIn();
  for(const e of ents) if(e.foe&&!e.gone) ai(e);
  for(const e of ents) if(!e.gone) upEnt(e);
  upBub(); upFairy(); sep(); upItems();
  ents=ents.filter(e=>!e.gone); upWaves(); upFx(); syncButtons();
}
function render(){
  X.save(); if(shake>0)X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  if(mode==='title'){drawTitle();X.restore();return;}
  if(mode==='end'){drawEnd();X.restore();return;}
  drawBG();
  // 출구 빛기둥
  if(exitOpen){ const ex=SCENES[sceneIdx].len-40-camX;
    if(ex>-80&&ex<W+80){ const g2=X.createLinearGradient(ex,FLOOR_TOP-160,ex,FLOOR_BOT);
      g2.addColorStop(0,'rgba(255,243,168,0)');g2.addColorStop(1,'rgba(255,243,168,0.55)');
      X.fillStyle=g2;X.beginPath();X.moveTo(ex-14,FLOOR_TOP-160);X.lineTo(ex+14,FLOOR_TOP-160);
      X.lineTo(ex+40,FLOOR_BOT);X.lineTo(ex-40,FLOOR_BOT);X.fill();
      X.globalAlpha=.6+Math.sin(frame*.09)*.3;X.fillStyle='#fff6c4';
      star(ex,FLOOR_TOP-40+Math.sin(frame*.06)*10,12);X.globalAlpha=1; } }
  // 바닥에 놓인 소품
  for(const w of wprops){ if(w.taken)continue; const sx=w.x-camX;
    if(sx<-60||sx>W+60)continue; const by=Math.sin(w.bob)*4;
    X.globalAlpha=.22;X.fillStyle='#5a466e';X.beginPath();X.ellipse(sx,w.z+6,15,5,0,0,7);X.fill();
    const near=w.armed&&Math.hypot(player.x-w.x,(player.z-w.z)*1.3)<46&&!player.prop;
    X.globalAlpha=(w.armed?(near?.85:.5)+Math.sin(frame*.08)*.15:.16);
    X.fillStyle=near?'#ffe08a':'#ffd166';
    X.beginPath();X.arc(sx,w.z-26+by,near?25:20,0,7);X.fill();X.globalAlpha=1;
    if(near){ X.globalAlpha=.6+Math.sin(frame*.16)*.35;X.fillStyle='#fff';
      X.textAlign='center';X.font='800 15px system-ui';X.fillText('↑',sx,w.z-56+by);X.globalAlpha=1; }
    if(PROPART.img.complete){ const a=PROPART[w.k],C=PROPART.cell;
      X.drawImage(PROPART.img,0,a.row*C,C,C, sx-21, w.z-48+by, 42,42); } }
  // 물건 (가까이 가야 보인다)
  for(const it of items){ if(it.got)continue; const sx=it.x-camX;
    if(sx<-60||sx>W+60)continue;
    if(it.carrier){ const cy=it.carrier.z-it.carrier.def.r*2.3-it.carrier.y-14;
      X.globalAlpha=.75+Math.sin(frame*.1)*.2;X.textAlign='center';X.font='18px system-ui';
      X.fillText(ICON[it.n]||'✨',sx,cy);X.globalAlpha=1; continue; }
    if(!it.rev) continue;
    const by=Math.sin(it.bob)*5;
    X.globalAlpha=.25;X.fillStyle='#5a466e';X.beginPath();X.ellipse(sx,it.z+8,14,5,0,0,7);X.fill();
    X.globalAlpha=1; X.fillStyle='#fff6c4';X.beginPath();X.arc(sx,it.z-22+by,17,0,7);X.fill();
    X.textAlign='center';X.font='22px system-ui';X.fillText(ICON[it.n]||'✨',sx,it.z-14+by); }
  const order=[...ents].sort((a,b)=>a.z-b.z);
  for(const e of order){ if(e===player)drawHero(e); else drawBlob(e); }
  // 비눗방울
  for(const b of bubbles){ const sx=b.x-camX,sy=b.z-b.y;
    X.strokeStyle='rgba(255,255,255,0.85)';X.lineWidth=2;
    X.fillStyle='rgba(210,240,255,0.35)';
    X.beginPath();X.arc(sx,sy,b.r,0,7);X.fill();X.stroke();
    X.fillStyle='rgba(255,255,255,0.8)';
    X.beginPath();X.arc(sx-b.r*.35,sy-b.r*.35,b.r*.22,0,7);X.fill(); }
  if(nav&&player){ const tx=nav.wx-camX, ty=nav.wz;
    X.globalAlpha=.35+Math.sin(frame*.16)*.2; X.strokeStyle='#fff6c4'; X.lineWidth=2;
    X.beginPath();X.ellipse(tx,ty,16,7,0,0,7);X.stroke();
    X.beginPath();X.ellipse(tx,ty,7,3,0,0,7);X.stroke();
    if(nav.hold){ X.setLineDash([5,7]); X.beginPath();
      X.moveTo(player.x-camX,player.z);X.lineTo(tx,ty);X.stroke(); X.setLineDash([]); }
    X.globalAlpha=1; }
  drawFairy();
  for(const f of fx){ if(f.k==='ring'){ const t0=f.t0||24;
      X.globalAlpha=Math.max(0,Math.min(1,f.t/t0))*.5;
      X.strokeStyle=f.fairy?'#fff3a8':'#ffd9e6';X.lineWidth=3;
      const rr=Math.max(1,(t0-f.t)*(f.fairy?5:7));
      X.beginPath();X.arc(f.x-camX,f.z-(f.fairy&&fairy?fairy.y:0),rr,0,7);X.stroke();
      X.globalAlpha=1; continue; }
    X.globalAlpha=Math.min(1,f.t/18);
    if(f.k==='f'){X.fillStyle=f.c;X.beginPath();
      for(let i=0;i<5;i++){const a=Math.PI*2*i/5;X.arc(f.x-camX+Math.cos(a)*3,f.z+Math.sin(a)*3,2.6,0,7);}
      X.fill();}
    else if(f.k==='n'){X.fillStyle=f.c;X.font='16px system-ui';X.textAlign='center';
      X.fillText('♪',f.x-camX,f.z);}
    else {X.fillStyle=f.c;star(f.x-camX,f.z,3.2);} }
  X.globalAlpha=1;
  drawHUD(); if(!COARSE) drawKeyGuide(); drawBanner();
  if(helpOpen) drawHelp();
  X.restore();
}
let last=performance.now(),acc=0;
function loop(now){ acc+=Math.min(100,now-last); last=now;
  while(acc>=1000/60){ step(); for(const k in hit)hit[k]=false; acc-=1000/60; }
  render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
