<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d3440">
<title>단어 빙고</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    color:#23414d;background:#1d3440}
  body{background:radial-gradient(130% 80% at 50% 0%,#e3f6d8 0%,#9fd9c8 36%,#4f9aa8 70%,#1d3440 100%);
    background-attachment:fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    display:flex;justify-content:center;
    --pk-accent:#2f8f8a;--pk-soft:#eef8f5;--pk-ink:#24535a;--pk-mute:#5b8a8f;--pk-line:#c8e3dd}
  #app{width:100%;max-width:440px;padding:18px 14px 28px;display:flex;flex-direction:column;gap:12px}

  h1{margin:4px 0 0;font-size:27px;letter-spacing:-.5px;color:#fff;text-align:center;
    text-shadow:0 2px 10px rgba(20,60,70,.35)}
  .sub{margin:0;text-align:center;color:#ffffffd8;font-size:13px;font-weight:600}
  .leave{display:block;margin:6px auto 0;width:auto;background:none;color:#fff;opacity:.85;font-size:13px;font-weight:700;padding:6px 12px;text-decoration:underline}

  .card{background:rgba(255,255,255,.94);border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(20,55,65,.22)}
  .card h2{margin:0 0 10px;font-size:15px;color:#2b6a6d}

  button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:14px 16px;cursor:pointer;
    touch-action:manipulation;transition:transform .06s,filter .15s}
  button:active:not(:disabled){transform:scale(.97)}
  button:disabled{opacity:.45;cursor:default}
  .primary{background:linear-gradient(135deg,#3fb3a4,#2f8f8a);color:#fff;width:100%;font-size:17px;
    box-shadow:0 6px 16px rgba(47,143,138,.35)}
  .ghost{background:#e6f4f1;color:#2b6a6d;width:100%}
  .row{display:flex;gap:8px}
  .row>*{flex:1}

  input{font:inherit;width:100%;padding:13px;border-radius:14px;border:2px solid #d4ebe6;
    background:#fff;color:#23414d;font-weight:700;text-align:center}
  input:focus{outline:0;border-color:#2f8f8a}
  #code{letter-spacing:10px;font-size:26px;font-weight:900;padding-left:10px}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{padding:9px 11px;font-size:13.5px;border-radius:12px;background:#eef8f5;color:#2b6a6d;border:2px solid transparent;flex:none}
  .chips button.on{border-color:#2f8f8a;background:#fff;color:#1f6f6a}
  .chips.even button{flex:1}
  #topic-text{margin-top:8px;text-align:left}
  .hint{font-size:12px;font-weight:700;color:#5b8a8f;margin:6px 0 0;line-height:1.5}

  .codebox{text-align:center;background:linear-gradient(135deg,#f0faf7,#dff3ee);border-radius:16px;padding:14px}
  .codebox .n{font-size:40px;font-weight:900;letter-spacing:8px;color:#2f8f8a;padding-left:8px}
  .codebox .t{font-size:12px;font-weight:700;color:#5b8a8f}

  .topicbar{display:flex;align-items:center;gap:8px;background:#f0faf7;border-radius:14px;padding:9px 12px;font-weight:800;font-size:14px;color:#24535a}
  .topicbar .ic{font-size:20px}
  .topicbar .r{margin-left:auto;font-size:12px;color:#5b8a8f;white-space:nowrap}
  .topicbar button{padding:6px 10px;font-size:12.5px;border-radius:10px;background:#fff;color:#2b6a6d;box-shadow:inset 0 0 0 2px #d4ebe6}

  /* 단어 쓰기 칸 */
  .wgrid{display:grid;gap:5px}
  .wgrid input{padding:4px 2px;border-radius:10px;font-size:clamp(12px,3.4vw,15px);aspect-ratio:1;min-width:0;
    border:2px solid #d4ebe6;background:#fbfefd;letter-spacing:-.3px}
  .wgrid.s3 input{font-size:clamp(15px,4.6vw,19px)}
  .wgrid input.long{font-size:clamp(10px,2.7vw,12px);letter-spacing:-.6px}
  .wgrid input.dup{border-color:#e0605a;background:#fff2f1}
  .wgrid input:disabled{opacity:1;color:#23414d;background:#eef8f5;-webkit-text-fill-color:#23414d}
  .count{font-size:12.5px;font-weight:800;color:#5b8a8f;text-align:right;margin:6px 2px 0}

  /* 게임 판 */
  .board{display:grid;gap:5px}
  .cell{aspect-ratio:1;border-radius:11px;background:#f4fbf9;color:#24535a;font-weight:800;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;line-height:1.15;
    border:2px solid #d4ebe6;word-break:keep-all;overflow-wrap:anywhere;transition:background .18s,color .18s,transform .12s;
    font-size:clamp(11px,3.3vw,15px)}
  .board.s3 .cell{font-size:clamp(15px,4.6vw,20px)}
  .board.s4 .cell{font-size:clamp(13px,3.9vw,17px)}
  .cell.long{font-size:clamp(10px,2.8vw,13px)}
  .cell.hit{background:linear-gradient(140deg,#5fc6b3,#2f8f8a);color:#fff;border-color:#2f8f8a;transform:scale(.96)}
  .cell.line{background:linear-gradient(140deg,#ffd27a,#f6a93b);border-color:#f0a033;color:#5e3a12}
  .cell.last{box-shadow:0 0 0 3px #fff,0 0 0 6px #e0605a}
  .cell.pick{cursor:pointer}
  .cell.pick:active{transform:scale(.9)}
  .board.mini{gap:3px}
  .board.mini .cell{border-radius:7px;font-size:clamp(9px,2.5vw,11px);border-width:1px;transform:none}

  .who{display:flex;gap:8px}
  .who>div{flex:1;text-align:center;background:#eef8f5;border-radius:14px;padding:9px 6px}
  .who .nm{font-size:12px;font-weight:700;color:#5b8a8f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .v{font-size:22px;font-weight:900;color:#2f8f8a;line-height:1.2}
  .who .v small{font-size:12px;color:#86aeb1}
  .who.turn0>div:nth-child(1),.who.turn1>div:nth-child(2){background:#fff5d6;box-shadow:inset 0 0 0 2px #f2c55c}
  .banner{text-align:center;border-radius:14px;padding:11px;font-weight:800;font-size:15px}
  .banner.me{background:linear-gradient(135deg,#fff3c4,#ffd98a);color:#7a5320}
  .banner.you{background:#e9f1ef;color:#5f7d80}
  .lastw{text-align:center;margin-top:10px}
  .lastw .w{font-size:30px;font-weight:900;color:#2f8f8a;line-height:1.15;word-break:keep-all}
  .lastw .w.none{font-size:18px;color:#a9c8c5}
  .lastw .t{font-size:12px;font-weight:700;color:#5b8a8f}
  .both{display:inline-block;margin-left:4px;font-size:12px;font-weight:900;color:#d24f6e;background:#ffe8ee;border-radius:8px;padding:2px 6px;vertical-align:4px}

  .log{display:flex;flex-direction:column;gap:5px;max-height:190px;overflow-y:auto}
  .log div{background:#f4fbf9;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;color:#3d5f66}
  .log div b{color:#1f6f6a}

  .result{text-align:center}
  .result .big{font-size:30px;font-weight:900;margin:4px 0}
  .win .big{color:#2f8f8a} .lose .big{color:#6d7f86} .draw .big{color:#b07a2a}
  .boards2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .boards2 .nm{font-size:12.5px;font-weight:800;color:#2b6a6d;text-align:center;margin-bottom:5px}

  #err{background:#163c44;color:#ddf5ef;border-radius:14px;padding:11px 14px;font-size:13px;font-weight:700;text-align:center}
  .hide{display:none!important}
  .muted{color:#5b8a8f;font-size:12.5px;font-weight:700;text-align:center;margin:0}
  .dots::after{content:'';animation:d 1.2s steps(4,end) infinite}
  @keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  .first{text-align:center;border-radius:14px;padding:10px;font-weight:800;font-size:14px;background:#fff6e0;color:#8a5a1c;margin-bottom:10px}
  .rbtn{width:auto;padding:7px 12px;font-size:13px;border-radius:11px;background:#fff6e0;color:#8a5a1c}
  a.back{display:block;text-align:center;color:#ffffffc8;font-size:12px;font-weight:700;text-decoration:none;padding:4px}
</style>
</head>
<body>
<div id="app">
  <h1>✏️ 단어 빙고</h1>
  <p class="sub" id="sub">주제를 정하고, 각자 판에 단어를 직접 써요</p>
  <button id="b-leave" class="leave hide">방 나가기</button>
  <div id="err" class="hide"></div>

  <!-- 1. 시작 -->
  <section id="s-home" class="card hide">
    <button class="ghost" id="b-rules-home" style="margin-bottom:14px">📖 규칙 보기</button>
    <h2>방 만들기</h2>
    <input id="name" maxlength="8" placeholder="내 이름 (선택)" autocomplete="off">
    <h2 style="margin:16px 0 8px">주제</h2>
    <div class="chips" id="topics"></div>
    <input id="topic-text" class="hide" maxlength="20" placeholder="주제를 써요 (예: 우리가 같이 본 영화)" autocomplete="off">
    <h2 style="margin:16px 0 8px">판 크기</h2>
    <div class="chips even" id="sizes"></div>
    <h2 style="margin:16px 0 8px">몇 줄 먼저?</h2>
    <div class="chips even" id="goals"></div>
    <p class="hint" id="opt-hint"></p>
    <h2 style="margin:16px 0 8px">누가 먼저 부를지</h2>
    <div id="pick-kind"></div>
    <div style="height:12px"></div>
    <button class="primary" id="b-create">새 방 만들기</button>
    <div style="height:8px"></div>
    <button class="ghost" id="b-bot">🤖 혼자 하기 (AI 상대)</button>
    <h2 style="margin-top:22px">코드로 들어가기</h2>
    <input id="code" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
    <div style="height:10px"></div>
    <button class="ghost" id="b-join">들어가기</button>
  </section>

  <!-- 2. 대기 -->
  <section id="s-wait" class="card hide">
    <div class="codebox">
      <div class="t">방 코드</div>
      <div class="n" id="w-code">----</div>
    </div>
    <div style="height:10px"></div>
    <div class="topicbar" id="w-topic"></div>
    <div style="height:10px"></div>
    <button class="ghost" id="b-share">초대 링크 복사</button>
    <p class="muted" style="margin-top:14px"><span class="dots">상대를 기다리는 중</span></p>
    <p class="muted" style="margin:14px 0 10px;font-size:13px">둘 다 방을 만들었다면 한 명은 나가서 상대 코드로 들어가요</p>
    <button class="ghost" id="b-leave-wait">나가서 다른 코드로 들어가기</button>
  </section>

  <!-- 3. 선 정하기 -->
  <section id="s-pick" class="card hide"><div id="picker"></div></section>

  <!-- 4. 단어 쓰기 -->
  <section id="s-setup" class="card hide">
    <div class="first" id="s-first">—</div>
    <div class="topicbar" id="s-topic"></div>
    <h2 style="margin:12px 0 8px">내 판 — 칸마다 단어 하나씩</h2>
    <div class="wgrid" id="wgrid"></div>
    <p class="count" id="s-count"></p>
    <div style="height:8px"></div>
    <div class="row">
      <button class="ghost" id="b-fill">✨ 빈칸 채우기</button>
      <button class="ghost" id="b-clear">다 지우기</button>
    </div>
    <div style="height:8px"></div>
    <button class="primary" id="b-ready">준비 완료</button>
    <p class="muted" id="w-opp" style="margin-top:12px"></p>
    <p class="hint" style="text-align:center">상대가 쓴 단어랑 <b>똑같이</b> 써야 같이 지워져요. 띄어쓰기는 상관없어요.</p>
  </section>

  <!-- 5. 플레이 -->
  <section id="s-play" class="hide" style="display:flex;flex-direction:column;gap:12px">
    <div class="card" style="padding:14px">
      <div class="topicbar" id="p-topic"></div>
      <div style="height:10px"></div>
      <div class="who" id="p-who">
        <div><div class="nm" id="p-me-n">나</div><div class="v" id="p-me-v">0<small>줄</small></div></div>
        <div><div class="nm" id="p-you-n">상대</div><div class="v" id="p-you-v">0<small>줄</small></div></div>
      </div>
      <div style="height:10px"></div>
      <div class="banner" id="p-banner">—</div>
      <div class="lastw"><div class="w none" id="p-last">아직 없어요</div><div class="t" id="p-last-t">마지막으로 부른 단어</div></div>
    </div>
    <div class="card"><div id="board-play" class="board"></div></div>
    <div class="card"><h2>부른 단어</h2><div class="log" id="p-log"></div></div>
  </section>

  <!-- 6. 결과 -->
  <section id="s-done" class="card hide">
    <div class="result" id="d-box">
      <div class="big" id="d-big">—</div>
      <p class="muted" id="d-sub"></p>
    </div>
    <div class="boards2">
      <div><div class="nm" id="d-me-n">내 판</div><div class="board mini" id="d-me"></div></div>
      <div><div class="nm" id="d-you-n">상대 판</div><div class="board mini" id="d-you"></div></div>
    </div>
    <p class="muted" id="d-both" style="margin-top:10px"></p>
    <div style="height:14px"></div>
    <button class="primary" id="b-again">다시 하기</button>
  </section>

  <a class="back" href="../">← 다른 게임</a>
</div>
<script src="../couple-common/picker.js"></script>
<script src="../couple-common/rules.js"></script>
<script src="../couple-common/report.js"></script>
<script>
/* =========================================================================
   단어 빙고 — 주제를 정하고 각자 판에 단어를 직접 써서 번갈아 부른다.
   흐름: 대기 → 선 정하기(미니게임) → 단어 쓰기 → 번갈아 부르기 → 끝
   상태는 서버(POST /api/wordbingo)가 들고 있고, 여기는 그리기만 한다.
   규칙은 netlify/lib/wordbingo-core.mjs 가 정답이다. 주제 이름·아이콘은 거기 TOPICS 와 맞춘다.
   ========================================================================= */
const API = '/api/wordbingo', SAVE = 'couple-wordbingo', POLL_MS = 1400, POLL_SLOW_MS = 3200;
const $ = (id) => document.getElementById(id);
const TOPICS = [
  ['fruit', '🍎', '과일'], ['animal', '🐶', '동물'], ['food', '🍜', '음식'], ['country', '🌏', '나라'],
  ['subway', '🚇', '서울 지하철역'], ['job', '🧑‍🍳', '직업'], ['sport', '⚽', '운동'], ['snack', '🍪', '간식'],
  ['trip', '✈️', '같이 가고 싶은 곳'], ['date', '💕', '데이트 하고 싶은 것'], ['custom', '✏️', '직접 쓰기'],
];
const DEFAULT_LINES = { 3: 1, 4: 2, 5: 3 };
const norm = (w) => String(w || '').normalize('NFC').replace(/\s+/g, '').toLowerCase();

let S = { code: null, token: null, you: null, name: '' };
let st = null;
let timer = null, busy = false, lastSeenCall = -1;

/* ------------------------------------------------------------------ 통신 */
async function api(action, extra) {
  const body = { action, code: S.code, token: S.token, ...(extra || {}) };
  let res;
  try {
    res = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  } catch (e) { throw new Error('인터넷이 끊긴 것 같아요'); }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    if (res.status === 404 && !data.error) throw new Error('서버를 찾지 못했어요. 넷리파이에 올린 주소로 열어주세요');
    throw new Error(data.error || '요청이 실패했어요 (' + res.status + ')');
  }
  return data;
}
function adopt(data) {
  if (data.token) S.token = data.token;
  if (data.code) S.code = data.code;
  if (typeof data.you === 'number') S.you = data.you;
  st = data;
  tellOpener();                                   // st 가 갱신된 뒤 (bot 여부를 같이 보낸다)
  Report.couple(SAVE.replace('couple-', ''), S, st);   // 판이 끝났으면 탕비실에 전적 보고 (한 번)
  save();
  render();
}
/* 탕비실(신영 메신저 lounge.html)이 window.open 으로 이 페이지를 열었으면, 방 코드가 생겼을 때
 * 한 번 알려준다 — 탕비실이 방 사람들에게 "참가하기" 초대를 띄운다. 네 자리 코드뿐이라 대상 origin 은 가리지 않는다. */
let toldCode = null;
function tellOpener() {
  if (!S.code || toldCode === S.code || !window.opener) return;
  toldCode = S.code;
  try { window.opener.postMessage({ type: 'couple-room', game: SAVE.replace('couple-', ''), code: S.code, you: S.you, name: S.name, bot: !!(st && st.bot) }, '*'); } catch (e) {}
}
function save() {
  try { localStorage.setItem(SAVE, JSON.stringify({ code: S.code, token: S.token, name: S.name })); } catch (e) {}
}
function forget() {
  try { localStorage.removeItem(SAVE); } catch (e) {}
  S = { code: null, token: null, you: null, name: S.name };
  st = null;
}
function err(msg) {
  const e = $('err');
  if (!msg) { e.classList.add('hide'); return; }
  e.textContent = msg; e.classList.remove('hide');
  clearTimeout(err.t); err.t = setTimeout(() => e.classList.add('hide'), 4200);
}
async function act(fn) {
  if (busy) return;
  busy = true;
  try { await fn(); err(null); } catch (e) { err(e.message); } finally { busy = false; }
}

/* ------------------------------------------------------------------ 폴링 */
function poll() {
  clearTimeout(timer);
  const gap = (st && st.phase === 'done') ? POLL_SLOW_MS : POLL_MS;
  timer = setTimeout(async () => {
    if (S.code && S.token && document.visibilityState === 'visible' && !busy) {
      const tok = S.token;   // 기다리는 사이 방을 나갔으면 받은 답을 버린다
      try { const d = await api('state'); if (S.token === tok) adopt(d); } catch (e) { /* 다음 번에 다시 */ }
    }
    poll();
  }, gap);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.code) act(async () => adopt(await api('state')));
});

/* -------------------------------------------------------------- 소리 한 톨 */
let AC = null;
function beep(hi) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = 'sine';
    o.frequency.setValueAtTime(hi ? 880 : 520, t);
    o.frequency.exponentialRampToValueAtTime(hi ? 1320 : 680, t + 0.12);
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.18);
  } catch (e) {}
}

/* -------------------------------------------------------------- 방 설정 (시작 화면)
   고른 값은 그 폰에 기억한다. 서버가 options() 로 다시 거른다. */
const OPT_SAVE = SAVE + ':opts';
let opt = { topic: 'fruit', topicText: '', size: 5, lines: 3 };
try { Object.assign(opt, JSON.parse(localStorage.getItem(OPT_SAVE) || '{}')); } catch (e) {}
function chips(el, items, onPick) {
  return items.map(([val, label]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label; b.dataset.v = val;
    b.onclick = () => onPick(val);
    el.appendChild(b);
    return b;
  });
}
const topicBtns = chips($('topics'), TOPICS.map(([id, ic, lb]) => [id, ic + ' ' + lb]), (v) => { opt.topic = v; drawOpts(); if (v === 'custom') $('topic-text').focus(); });
const sizeBtns = chips($('sizes'), [[3, '3×3'], [4, '4×4'], [5, '5×5']], (v) => { opt.size = v; opt.lines = DEFAULT_LINES[v]; drawOpts(); });
const goalBtns = chips($('goals'), [1, 2, 3, 4, 5].map((n) => [n, n + '줄']), (v) => { opt.lines = v; drawOpts(); });
$('topic-text').value = opt.topicText || '';
$('topic-text').addEventListener('input', () => { opt.topicText = $('topic-text').value; drawOpts(); });
function drawOpts() {
  topicBtns.forEach((b) => b.classList.toggle('on', b.dataset.v === opt.topic));
  sizeBtns.forEach((b) => b.classList.toggle('on', Number(b.dataset.v) === opt.size));
  goalBtns.forEach((b) => b.classList.toggle('on', Number(b.dataset.v) === opt.lines));
  $('topic-text').classList.toggle('hide', opt.topic !== 'custom');
  $('opt-hint').textContent = `${opt.size}×${opt.size} 판에 단어 ${opt.size * opt.size}개를 써요. 가로·세로·대각선 ${opt.lines}줄을 먼저 지우면 이겨요.`;
  try { localStorage.setItem(OPT_SAVE, JSON.stringify(opt)); } catch (e) {}
}
drawOpts();
const topicLine = (t) => (t ? t.icon + ' ' + t.label : '');
function drawTopicBar(el, extra) {
  el.innerHTML = '<span class="ic">' + esc(st.topic.icon) + '</span><span>' + esc(st.topic.label) + '</span>'
    + '<span class="r">' + st.size + '×' + st.size + ' · ' + st.winLines + '줄 먼저</span>' + (extra || '');
}

/* -------------------------------------------------------------- 단어 쓰기
   입력칸은 판 크기가 바뀔 때만 새로 만든다. 쓰는 중인 글자는 그 폰에 방·판 번호별로 임시 저장. */
let wInputs = [], wSize = 0;
const draftKey = () => SAVE + ':draft:' + st.code + ':' + st.round;
function loadDraft() { try { return JSON.parse(localStorage.getItem(draftKey()) || '[]'); } catch (e) { return []; } }
function saveDraft() { try { localStorage.setItem(draftKey(), JSON.stringify(wInputs.map((x) => x.value))); } catch (e) {} }
function buildInputs(size) {
  const g = $('wgrid');
  g.textContent = '';
  g.style.gridTemplateColumns = `repeat(${size},1fr)`;
  g.className = 'wgrid s' + size;
  const draft = loadDraft();
  wInputs = [...Array(size * size)].map((_, i) => {
    const x = document.createElement('input');
    x.maxLength = 10; x.autocomplete = 'off'; x.enterKeyHint = 'next';
    x.placeholder = String(i + 1);
    x.value = draft[i] || '';
    x.addEventListener('input', () => { saveDraft(); checkInputs(); });
    x.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const next = wInputs.slice(i + 1).find((y) => !y.value.trim()) || wInputs.find((y) => !y.value.trim());
      if (next) next.focus(); else x.blur();
    });
    g.appendChild(x);
    return x;
  });
  wSize = size;
}
function checkInputs() {
  const keys = wInputs.map((x) => norm(x.value));
  const count = {};
  keys.forEach((k) => { if (k) count[k] = (count[k] || 0) + 1; });
  let filled = 0, dups = 0;
  wInputs.forEach((x, i) => {
    const dup = keys[i] && count[keys[i]] > 1;
    x.classList.toggle('dup', !!dup);
    x.classList.toggle('long', x.value.trim().length > (wSize === 3 ? 6 : 4));   // 긴 단어는 칸 안에 들어오게 작게
    if (keys[i]) filled++;
    if (dup) dups++;
  });
  const n = wInputs.length;
  $('s-count').textContent = filled + '/' + n + '칸' + (dups ? ' · 같은 단어가 있어요 (빨간 칸)' : '');
  if (!st.ready) {
    $('b-ready').disabled = false;
    $('b-ready').textContent = filled < n ? `준비 완료 (${n - filled}칸 남음)` : dups ? '같은 단어를 고쳐요' : '준비 완료';
  }
  return { filled, dups, n };
}
$('b-fill').onclick = () => {
  if (!st || !st.suggest) return;
  const used = new Set(wInputs.map((x) => norm(x.value)).filter(Boolean));
  const pool = st.suggest.filter((w) => !used.has(norm(w)));
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  wInputs.forEach((x) => { if (!x.value.trim() && pool.length) x.value = pool.pop(); });
  saveDraft(); checkInputs();
};
$('b-clear').onclick = () => {
  if (wInputs.some((x) => x.value.trim()) && !confirm('쓴 단어를 다 지울까요?')) return;
  wInputs.forEach((x) => (x.value = '')); saveDraft(); checkInputs();
};
$('b-ready').onclick = () => {
  const c = checkInputs();
  if (c.filled < c.n) {
    err(`아직 ${c.n - c.filled}칸이 비어 있어요` + (st.suggest ? ' — ✨ 빈칸 채우기를 눌러도 돼요' : ''));
    const empty = wInputs.find((x) => !x.value.trim()); if (empty) empty.focus();
    return;
  }
  if (c.dups) { err('같은 단어를 두 번 썼어요 (빨간 칸)'); return; }
  act(async () => adopt(await api('ready', { board: wInputs.map((x) => x.value) })));
};

/* -------------------------------------------------------------- 게임 판
   칸은 판 크기가 바뀔 때만 만든다. 폴링 때마다 새로 만들면 누르는 도중에 칸이 바뀌어 탭이 씹힌다. */
function boardView(el, onPick) {
  let cells = [], size = 0;
  return {
    draw(board, sz, called, opts) {
      opts = opts || {};
      if (sz !== size) {
        el.textContent = '';
        el.style.gridTemplateColumns = `repeat(${sz},1fr)`;
        el.classList.remove('s3', 's4', 's5'); el.classList.add('s' + sz);
        cells = [...Array(sz * sz)].map((_, i) => {
          const d = document.createElement('div');
          d.onclick = () => { if (onPick && d.classList.contains('pick')) onPick(i); };
          el.appendChild(d);
          return d;
        });
        size = sz;
      }
      const keys = new Set((called || []).map((c) => norm(c.w)));
      const on = new Set();
      if (board) for (const ln of linesFor(sz)) if (ln.every((i) => keys.has(norm(board[i])))) ln.forEach((i) => on.add(i));
      cells.forEach((d, i) => {
        const w = board ? board[i] : '';
        if (d.textContent !== w) d.textContent = w;
        const hit = keys.has(norm(w));
        d.className = 'cell' + (w.length > 5 ? ' long' : '') + (hit ? ' hit' : '') + (on.has(i) ? ' line' : '')
          + (opts.last && norm(w) === norm(opts.last) ? ' last' : '') + (opts.pickable && !hit ? ' pick' : '');
      });
    },
  };
}
function linesFor(size) {
  const out = [];
  for (let r = 0; r < size; r++) out.push([...Array(size)].map((_, c) => r * size + c));
  for (let c = 0; c < size; c++) out.push([...Array(size)].map((_, r) => r * size + c));
  out.push([...Array(size)].map((_, i) => i * size + i));
  out.push([...Array(size)].map((_, i) => i * size + (size - 1 - i)));
  return out;
}
const playBoard = boardView($('board-play'), (i) => act(async () => { beep(true); adopt(await api('call', { i })); }));
const doneMe = boardView($('d-me')), doneYou = boardView($('d-you'));

/* -------------------------------------------------------------- 선 정하기 */
const chooser = Picker.chooser($('pick-kind'));
const ackKey = () => SAVE + ':pick:' + st.code + ':' + st.round;
const acked = () => { try { return sessionStorage.getItem(ackKey()) === '1'; } catch (e) { return false; } };
const picker = Picker.mount($('picker'), {

});

/* ------------------------------------------------------------------ 그리기 */
function show(id) {
  ['s-home', 's-wait', 's-pick', 's-setup', 's-play', 's-done'].forEach((s) => $(s).classList.toggle('hide', s !== id));
  $('b-leave').classList.toggle('hide', id === 's-home');
}
const meName = () => (st && st.name) || S.name || '나';
const youName = () => (st && st.opponent.name) || '상대';
const jo = Picker.jo;
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function render() {
  if (!st) { show('s-home'); $('sub').textContent = '주제를 정하고, 각자 판에 단어를 직접 써요'; return; }

  if (st.phase === 'wait') {
    show('s-wait');
    $('sub').textContent = '방 코드를 알려주고 같이 들어와요';
    $('w-code').textContent = st.code;
    drawTopicBar($('w-topic'));
    return;
  }

  if (st.phase === 'pick' || ((st.phase === 'setup' || (st.phase === 'play' && !st.called.length)) && !acked())) {
    show('s-pick');
    $('sub').textContent = '방 ' + st.code + ' · 누가 먼저 부를까요';
    picker.update(st.pick, { you: S.you, meName: meName(), youName: youName(), round: st.round,
      extra: (meFirst) => (meFirst ? '내가 먼저 단어를 불러요' : jo(youName(), '이', '가') + ' 먼저 불러요') + ' · 주제: ' + topicLine(st.topic) });
    return;
  }

  if (st.phase === 'setup') {
    show('s-setup');
    $('sub').textContent = '방 ' + st.code + ' · 단어를 써요';
    $('s-first').textContent = st.first === S.you ? '🎉 내가 먼저 불러요' : jo(youName(), '이', '가') + ' 먼저 불러요';
    drawTopicBar($('s-topic'));
    const gridKey = st.code + ':' + st.round;      // 방이나 판이 바뀌면 칸을 새로 (임시 저장도 그 판 것)
    if (wSize !== st.size || !wInputs.length || $('wgrid').dataset.key !== gridKey) {
      buildInputs(st.size);
      $('wgrid').dataset.key = gridKey;
    }
    if (st.ready && st.board) wInputs.forEach((x, i) => { x.value = st.board[i]; });
    wInputs.forEach((x) => (x.disabled = !!st.ready));
    $('b-fill').classList.toggle('hide', !st.suggest);
    $('b-fill').disabled = $('b-clear').disabled = !!st.ready;
    checkInputs();
    if (st.ready) { $('b-ready').disabled = true; $('b-ready').textContent = '준비 완료 ✓'; }
    $('w-opp').innerHTML = st.opponentReady ? '✓ ' + esc(youName()) + ' 준비 완료'
      : '<span class="dots">' + esc(jo(youName(), '이', '가')) + ' 단어를 쓰는 중</span>';
    return;
  }

  if (st.phase === 'play') {
    show('s-play');
    $('sub').textContent = '방 ' + st.code + ' · ' + meName() + ' vs ' + youName();
    drawTopicBar($('p-topic'));
    $('p-topic').appendChild(rulesBtn);
    $('p-me-n').textContent = meName();
    $('p-you-n').textContent = youName();
    $('p-me-v').innerHTML = st.lines[S.you] + '<small>/' + st.winLines + '줄</small>';
    $('p-you-v').innerHTML = st.lines[1 - S.you] + '<small>/' + st.winLines + '줄</small>';
    $('p-who').className = 'who turn' + (st.turn === S.you ? 0 : 1);
    const b = $('p-banner');
    b.className = 'banner ' + (st.yourTurn ? 'me' : 'you');
    b.innerHTML = st.yourTurn ? '내 차례 — 내 판에서 부를 단어를 눌러요'
      : '<span class="dots">' + esc(jo(youName(), '이', '가')) + ' 고르는 중</span>';
    const last = st.called.length ? st.called[st.called.length - 1] : null;
    $('p-last').innerHTML = last ? esc(last.w) + (last.both ? '<span class="both">💕 둘 다</span>' : '') : '아직 없어요';
    $('p-last').className = 'w' + (last ? '' : ' none');
    $('p-last-t').textContent = last ? (last.by === S.you ? '내가 부른 단어' : jo(youName(), '이', '가') + ' 부른 단어') : '마지막으로 부른 단어';
    playBoard.draw(st.board, st.size, st.called, { last: last && last.w, pickable: st.yourTurn });
    drawLog();
    if (st.called.length !== lastSeenCall) {
      if (lastSeenCall >= 0 && st.called.length > lastSeenCall && last && last.by !== S.you) beep(false);
      lastSeenCall = st.called.length;
    }
    return;
  }

  if (st.phase === 'done') {
    show('s-done');
    $('sub').textContent = '방 ' + st.code + ' · ' + topicLine(st.topic);
    const mine = st.lines[S.you], theirs = st.lines[1 - S.you];
    const kind = st.winner === 'draw' ? 'draw' : (st.winner === S.you ? 'win' : 'lose');
    $('d-box').className = 'result ' + kind;
    $('d-big').textContent = kind === 'win' ? '🎉 이겼어요!' : kind === 'lose' ? '졌어요…' : '무승부!';
    $('d-sub').textContent = meName() + ' ' + mine + '줄 · ' + youName() + ' ' + theirs + '줄 · 단어 ' + st.called.length + '개 불렀어요';
    $('d-me-n').textContent = meName() + '의 판';
    $('d-you-n').textContent = youName() + '의 판';
    doneMe.draw(st.board, st.size, st.called);
    doneYou.draw(st.opponentBoard, st.size, st.called);
    const same = st.board && st.opponentBoard ? st.board.filter((w) => st.opponentBoard.some((v) => norm(v) === norm(w))) : [];
    $('d-both').textContent = same.length ? '💕 둘 다 쓴 단어 ' + same.length + '개: ' + same.join(', ') : '둘 다 쓴 단어는 없었어요';
    lastSeenCall = -1;
    return;
  }
}
function drawLog() {
  const el = $('p-log');
  if (el.dataset.n === String(st.called.length)) return;
  el.dataset.n = String(st.called.length);
  el.innerHTML = st.called.length ? st.called.slice().reverse().map((c) =>
    '<div>' + esc(c.by === S.you ? '나' : youName()) + ' · <b>' + esc(c.w) + '</b>' + (c.both ? '<span class="both">💕 둘 다</span>' : '') + '</div>').join('')
    : '<div>아직 아무도 안 불렀어요</div>';
}

/* 방 나가기 — 방은 그대로 두고(12시간 뒤 만료) 이 폰에서만 잊는다 */
function leave() {
  if (st && st.phase !== 'wait' && st.phase !== 'done' && !confirm('방에서 나갈까요?\n하던 판은 여기서 끝나요')) return;

}
$('b-leave').onclick = leave;

/* ------------------------------------------------------------------ 시작 */
(async function boot() {
  show('s-home');
  const urlCode = new URLSearchParams(location.search).get('code');
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(SAVE) || 'null'); } catch (e) {}
  if (saved && saved.name) { S.name = saved.name; $('name').value = saved.name; }
  const urlName = (new URLSearchParams(location.search).get('name') || '').trim().slice(0, 8);
  if (urlName && !$('name').value) { S.name = urlName; $('name').value = urlName; }   // 탕비실 등에서 이름을 넘겨준 경우

  // 새로고침했으면 있던 방으로 돌아간다
  if (saved && saved.code && saved.token && (!urlCode || urlCode === saved.code)) {
    S.code = saved.code; S.token = saved.token;
    try { adopt(await api('state')); poll(); return; } catch (e) { forget(); }
  }
  if (new URLSearchParams(location.search).get('bot') === '1') {   // 탕비실 '혼자 하기' — 바로 AI 방을 만든다
    history.replaceState(null, '', location.pathname);
    render();
    createRoom(true);
    return;
  }
  if (urlCode && /^\d{4}$/.test(urlCode)) {
    $('code').value = urlCode;
    $('sub').textContent = '초대받은 방 ' + urlCode + ' · 이름을 넣고 들어가요';
  }
  render();
})();
</script>
</body>
</html>
